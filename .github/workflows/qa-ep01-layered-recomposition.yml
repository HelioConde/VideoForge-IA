name: "VideoForge - EP01 comparar cenas RGBA e original"
run-name: "EP01 / QA recomposição visual C01-P02"
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VideoForge - EP01 extrair 4 camadas C01-P02 em serie"]
    types: [completed]
permissions:
  contents: write
jobs:
  real-recomposition:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow apenas para PNG RGBA local, sem proxy
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Reconstruir frame com background, carrasco, bainha e espada
        run: PYTHONPATH=. python scripts/qa-recomposicao-c01-p02.py
      - name: Arquivar JPEG comparativo e medição, sem aprovação artificial
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'videoforge-qa-recomposition[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          EP=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git add -- "$EP/QA-C01-P02-RECOMPOSICAO.jpg" "$EP/QA-C01-P02-RECOMPOSICAO.json"
          if git diff --cached --quiet; then
            echo "EP01_RECOMPOSITION_QA_ALREADY_COMMITTED"
            exit 0
          fi
          git commit -m 'qa(ep01): revisar recomposição RGBA real e diff do plano C01-P02'
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "EP01_RECOMPOSITION_PREVIEW_AND_HASH_ARCHIVED"
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
