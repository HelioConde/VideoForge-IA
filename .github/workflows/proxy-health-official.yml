name: "VideoForge - Validar gerador IA integrado (sem gerar imagem)"
on:
  workflow_dispatch:
    inputs:
      resume_remake:
        description: "Apos reconexao OAuth, retomar UMA tentativa da referencia V2"
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
    paths:
      - 'docs/requests/verificar-proxy-spy-family.json'
      - '.github/workflows/proxy-health-official.yml'
      - 'videoforge/proxy_images.py'
      - 'tests/test_proxy_images.py'
      - 'scripts/renovar-sessao-videoforge.ps1'
      - 'scripts/migrar-codex-proxy.ps1'
      - 'videoforge/remake_recovery.py'
      - 'tests/test_remake_recovery.py'

permissions:
  contents: write
  packages: read
  actions: write

jobs:
  check-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      CODEX_PROXY_BASE_URL: ${{ secrets.CODEX_PROXY_BASE_URL }}
      CODEX_PROXY_ACCOUNTS_JSON: ${{ secrets.CODEX_PROXY_ACCOUNTS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar chaves sem exibir valores
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CODEX_PROXY_API_KEY" ]]; then
            echo "::error::CODEX_PROXY_API_KEY nao configurado"
            exit 1
          fi
          if [[ -n "$CODEX_PROXY_BASE_URL" ]]; then
            echo "Modo: proxy persistente"
            printf 'PROXY_ENDPOINT=%s\n' "$CODEX_PROXY_BASE_URL" >> "$GITHUB_ENV"
          elif [[ -n "$CODEX_PROXY_ACCOUNTS_JSON" ]]; then
            echo "Modo: proxy efemero com snapshot autorizado"
            printf 'PROXY_ENDPOINT=http://127.0.0.1:18080\n' >> "$GITHUB_ENV"
            echo 'USE_EPHEMERAL=1' >> "$GITHUB_ENV"
          else
            echo "::error::Falta CODEX_PROXY_BASE_URL ou CODEX_PROXY_ACCOUNTS_JSON"
            exit 1
          fi
      - name: Iniciar proxy precompilado se necessario
        if: env.USE_EPHEMERAL == '1'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vf-proxy-state"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads(os.environ['CODEX_PROXY_ACCOUNTS_JSON'])
          assert isinstance(payload,dict) and isinstance(payload.get('records'),list)
          assert payload['records'] and all(isinstance(x,dict) and isinstance(x.get('token'),dict) for x in payload['records'])
          p=Path(os.environ['RUNNER_TEMP'])/'vf-proxy-state'/'accounts.json'
          p.write_text(json.dumps(payload),encoding='utf-8')
          p.chmod(0o600)
          PY
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          docker run -d --name vf-proxy-health \
            --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 \
            -e PROXY_API_KEY="$CODEX_PROXY_API_KEY" -e DATA_DIR=/app/data \
            -e DEBUG_LOG_PAYLOADS=false \
            -v "$RUNNER_TEMP/vf-proxy-state:/app/data:rw" \
            ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1 >/dev/null
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Proxy nao iniciou corretamente"
          exit 1
      - name: Diagnostico seguro de transporte local sem tokens nem geracao
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,urllib.request,urllib.error
          base=os.environ["PROXY_ENDPOINT"].rstrip("/")
          key=os.environ["CODEX_PROXY_API_KEY"]
          print("LOCAL_PROXY_ENV", "http_proxy_configured",
                any(name.lower()=="http_proxy" for name in os.environ),
                "urllib_bypass_127",urllib.request.proxy_bypass("127.0.0.1"))
          endpoints=("/health/live","/health")
          for route in endpoints:
              for mode in ("default","direct-no-proxy"):
                  if route=="/health/live" and mode=="default":
                      continue
                  opener=(urllib.request.build_opener(urllib.request.ProxyHandler({}))
                          if mode=="direct-no-proxy" else urllib.request.build_opener())
                  req=urllib.request.Request(
                      base+route,
                      headers={"Authorization":"Bearer "+key,"Accept":"application/json"})
                  try:
                      with opener.open(req,timeout=8) as response:
                          status=response.status
                          # No response bodies or account/token details in logs.
                  except urllib.error.HTTPError as error:
                      status=error.code
                  except Exception:
                      status="transport-error"
                  print("LOCAL_PROXY_HTTP_STATUS",route,mode,status)
          PY
      - name: Diagnosticar elegibilidade de contas e catalogo (somente GET)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections,datetime,json,os,urllib.error,urllib.request
          origin=os.environ["PROXY_ENDPOINT"].rstrip("/")
          key=os.environ["CODEX_PROXY_API_KEY"]
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for path in ("/admin/accounts","/v1/models"):
              req=urllib.request.Request(origin+path,
                  headers={"Authorization":"Bearer "+key,"Accept":"application/json"})
              try:
                  with opener.open(req,timeout=20) as resp:
                      payload=json.load(resp)
                      print("SAFE_UPSTREAM_PROBE",path,"http",resp.status)
                      if path=="/admin/accounts":
                          accounts=payload.get("accounts",[])
                          if not isinstance(accounts,list):
                              raise ValueError("accounts response is not a list")
                          counts=collections.Counter(str(a.get("status","unknown")) for a in accounts
                                                     if isinstance(a,dict))
                          eligible=sum(a.get("eligible_now") is True for a in accounts if isinstance(a,dict))
                          now=datetime.datetime.now(datetime.timezone.utc)
                          expired=0
                          for a in accounts:
                              if not isinstance(a,dict):continue
                              try:
                                  expiry=datetime.datetime.fromisoformat(a["oauth_expires"].replace("Z","+00:00"))
                                  expired+=expiry<=now
                              except (ValueError,KeyError,TypeError,AttributeError):pass
                          print("SAFE_ACCOUNT_COUNTS",json.dumps(
                              {"total":len(accounts),"by_status":dict(counts),
                               "eligible":eligible,"oauth_expired_count":expired},sort_keys=True))
                      elif isinstance(payload,dict):
                          print("SAFE_MODEL_CATALOG", "models_count",
                                len(payload.get("data",[])) if isinstance(payload.get("data"),list) else "unknown")
              except urllib.error.HTTPError as exc:
                  # Only whitelist a short machine-readable error code; never print
                  # payload, upstream text, user id, email, tokens or URLs.
                  code="unavailable"
                  try:
                      obj=json.loads(exc.read(4096))
                      err=obj.get("error",{})
                      raw=err.get("code","") if isinstance(err,dict) else ""
                      if raw in {"no_available_accounts","upstream_error",
                                 "upstream_unauthorized","quota_exhausted",
                                 "rate_limited","model_not_found",
                                 "continuation_account_unavailable"}:code=raw
                  except (ValueError,UnicodeError,TypeError):pass
                  print("SAFE_UPSTREAM_PROBE",path,"http",exc.code,"code",code)
              except (OSError,ValueError,TypeError):
                  print("SAFE_UPSTREAM_PROBE",path,"transport_or_json_invalid")
          PY
      - name: Testar uma renovacao OAuth sem geracao nem revelar credenciais
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.error,urllib.parse,urllib.request
          base=os.environ["PROXY_ENDPOINT"].rstrip("/")
          key=os.environ["CODEX_PROXY_API_KEY"]
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          headers={"Authorization":"Bearer "+key,"Accept":"application/json"}
          def request(route,method="GET"):
              req=urllib.request.Request(base+route,headers=headers,method=method)
              with opener.open(req,timeout=25) as response:
                  return json.load(response)
          try:
              accounts=request("/admin/accounts").get("accounts",[])
              if not isinstance(accounts,list) or len(accounts)!=1:
                  print("SAFE_OAUTH_REFRESH","skipped_ambiguous_account_count")
              else:
                  record=accounts[0]
                  if record.get("eligible_now") is True:
                      print("SAFE_OAUTH_REFRESH","skipped_already_eligible")
                  else:
                      account_id=record.get("id","")
                      if not isinstance(account_id,str) or not account_id.startswith("acct_"):
                          raise ValueError("Unexpected account ID format")
                      try:
                          request("/admin/accounts/"+urllib.parse.quote(account_id,safe="")+"/refresh","POST")
                          after=request("/admin/accounts").get("accounts",[])
                          eligible=sum(item.get("eligible_now") is True for item in after if isinstance(item,dict))
                          print("SAFE_OAUTH_REFRESH","ok","eligible_after",eligible)
                      except urllib.error.HTTPError as exc:
                          # Deliberately do not read or log refresh error body or secrets.
                          print("SAFE_OAUTH_REFRESH","failed_http",exc.code)
                      except (OSError,ValueError,TypeError):
                          print("SAFE_OAUTH_REFRESH","failed_transport_or_invalid")
          except (OSError,ValueError,TypeError):
              print("SAFE_OAUTH_REFRESH","preflight_failed")
          PY
      - name: Testes de regressao da verificacao de OAuth sem rede
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_proxy_images -v
      - name: Validar sintaxe PowerShell da reconexao e importacao sem executar login
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('scripts/renovar-sessao-videoforge.ps1',
                                'scripts/migrar-codex-proxy.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) $script),
              [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) {
              throw "POWERSHELL_SYNTAX_INVALID: $script"
            }
            Write-Host "POWERSHELL_SCRIPT_SYNTAX_OK: $script"
          }
      - name: Testes offline de reserva unica da retomada apos OAuth
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_remake_recovery -v
      - name: Testar contas e autenticacao sem imagem nem custos
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.proxy_images health --url "$PROXY_ENDPOINT"
          echo "PROXY_HEALTH_OK — contas acessiveis; nao confirma disponibilidade do modelo de imagem."
      - name: Retomar UMA imagem do remake somente apos health validado e pedido explicito
        if: github.event_name == 'workflow_dispatch' && inputs.resume_remake == true && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p output
          python -m videoforge.remake_recovery --output output/remake-oauth-resume.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("output/remake-oauth-resume.json").read_text(encoding="utf-8"))
          print("REMAKE_OAUTH_RESUME_ALLOWED",report["ready"],report.get("reason"))
          PY
          if [[ "$(python -c 'import json;print(json.load(open("output/remake-oauth-resume.json"))["ready"])')" != "True" ]]; then
            echo "RECOVERY_NO_NEW_CALL_NONRECOVERABLE_OR_ALREADY_RESERVED"
            exit 0
          fi
          EP="canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01"
          git config user.name "videoforge-recovery[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EP/estado-atual.json" "$EP/ESTADO-ATUAL.md" "$EP/HISTORICO-DESENVOLVIMENTO.md"
          git commit -m "chore(dorama): reserve single OAuth-recovered image dispatch"
          git push origin HEAD:main
          gh workflow run production-art-by-request.yml -R "$GH_REPO" --ref main \
            -f channel=alchemy-lab \
            -f video_id=mmorpg-conquiste-a-princesa-ep01 \
            -f asset=character-bible
          echo "ONE_RECOVERED_IMAGE_WORKFLOW_DISPATCHED_WITH_PERSISTED_RESERVATION"
      - name: Apagar tokens temporarios
        if: always()
        shell: bash
        run: |
          docker rm -f vf-proxy-health >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vf-proxy-state"
