name: "VideoForge - C12 MP4 tecnico ThreeCanvas 5 malhas originais"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'videoforge/c12_technical_preview.py'
      - 'videoforge/c12_render_qa.py'
      - 'videoforge/c12_upload_existing_zips.py'
      - 'scripts/enviar-zips-c12.ps1'
      - 'videoforge/import_c12_technical_zip.py'
      - 'tests/test_alchemy_c12_technical.py'
      - 'tests/test_alchemy_c12_render_qa.py'
      - 'tests/test_alchemy_c12_upload_existing_zips.py'
      - 'tests/test_alchemy_c12_import.py'
      - '.github/workflows/render-alchemy-c12-three-mesh-technical.yml'
      - 'motion-remotion/src/c12-mesh-technical*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-alchemy-c12-three-mesh-technical.yml'
      - 'videoforge/c12_technical_preview.py'
      - 'videoforge/c12_render_qa.py'
      - 'tests/test_alchemy_c12_technical.py'
      - 'tests/test_alchemy_c12_render_qa.py'
      - 'motion-remotion/src/c12-mesh-technical*'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-render-c12-tecnico.json'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/planos/**'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/referencias/chat-aprovadas/**'
permissions:
  contents: read
  packages: read
concurrency:
  group: vf-alchemy-c12-threecanvas-draft
  cancel-in-progress: false
jobs:
  contract-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir origens hashes imagens e regras de 7 sprites antigos
        run: python -m unittest tests.test_alchemy_c12_technical tests.test_alchemy_c12_import tests.test_alchemy_c12_render_qa tests.test_alchemy_c12_upload_existing_zips -v
  render-draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/helioconde/videoforge-remotion-runner:rig-three-remotion4-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Testar cinco malhas e engine ThreeCanvas sem imagens novas
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_alchemy_c12_technical tests.test_alchemy_c12_render_qa -v
          ln -s /opt/videoforge-remotion/node_modules motion-remotion/node_modules
          cd motion-remotion
          ./node_modules/.bin/tsc --noEmit
          node --test tests/c12-mesh-technical-contract.test.cjs tests/rig-three-math.test.cjs
      - name: Preparar pixels originais ou BLOQUEAR no preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.c12_technical_preview
      - name: Conferir recomposicao neutra com pixels RGBA originais por SHA
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.c12_render_qa neutral
      - name: Renderizar 8 segundos de malhas Three.js por Remotion SWANGLE
        shell: bash
        run: |
          set -euo pipefail
          OUT="output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/c12-mesh-technical"
          cd motion-remotion
          ./node_modules/.bin/remotion render src/c12-mesh-technical-index.ts \
            VideoForgeC12MeshDraftQA "../$OUT/c12-three-mesh-8s.mp4" \
            --props="../$OUT/props.json" --frames=0-239 --codec=h264 \
            --pixel-format=yuv420p --gl=swangle --concurrency=1 --log=error
          for frame in 0 73 120 180 239; do
            ./node_modules/.bin/remotion still src/c12-mesh-technical-index.ts \
              VideoForgeC12MeshDraftQA "../$OUT/frame-$frame.png" \
              --props="../$OUT/props.json" --frame="$frame" --gl=swangle --log=error
          done
          for frame in 73 180; do
            ./node_modules/.bin/remotion still src/c12-mesh-technical-index.ts \
              VideoForgeC12MeshDraftQA "../$OUT/frame-$frame-repeat.png" \
              --props="../$OUT/props.json" --frame="$frame" --gl=swangle --log=error
          done
      - name: Registrar QA de movimento localizado no MP4 e hashes, sem publicar
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.c12_render_qa mp4
      - name: Disponibilizar MP4 validado OU relatório de arquivos faltantes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vf-alchemy-c12-threecanvas-draft-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/c12-mesh-technical/
          retention-days: 14
          if-no-files-found: warn
