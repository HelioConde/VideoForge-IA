name: "VideoForge - EP01 conferir reparo localizado V3"
run-name: "EP01 / QA V3 mãe, contato editado e patch sem deslocamento"
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VideoForge - EP01 reparar contato bainha V3"]
    types: [completed]
permissions:
  contents: write
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow somente para QA local, sem nova geração
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Conferir SHA e gerar close da V3
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/qa-ep01-contact-v3.py
      - name: Publicar somente comparação V3 e metadados
        shell: bash
        run: |
          set -euo pipefail
          ep=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'videoforge-qa-contact-v3[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ep/QA-C01-P02-CONTATO-V3.jpg" "$ep/QA-C01-P02-CONTATO-V3.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(ep01): comparar contato bainha/luva V3 com a fonte sem aprovação'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
          done
          exit 1
