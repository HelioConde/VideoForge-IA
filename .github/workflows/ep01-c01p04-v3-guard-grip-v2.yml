name: "VideoForge - EP01 C01-P04 V3 reparar pegada guardas V2"
run-name: "EP01 C01-P04 / nova pegada ${{ inputs.part || 'pedido' }}"
on:
  workflow_dispatch:
    inputs:
      part:
        description: "Guarda para correção isolada da pegada"
        required: true
        type: choice
        options: [character-guarda_esquerdo, character-guarda_direito]
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-CORRECAO-PEGADA-C01-P04-V3.json'
permissions:
  contents: write
  packages: read
concurrency:
  group: ep01-c01p04-v3-guard-grip-v2-main
  cancel-in-progress: false

jobs:
  corrigir-mao-guarda:
    # DISABLED_BY_CREATOR_NO_HAND_SPLITS_2026_11_17
    if: ${{ false }} # archived hand split workflow; never bill proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      CODEX_PROXY_BASE_URL: ${{ secrets.CODEX_PROXY_BASE_URL }}
      CODEX_PROXY_ACCOUNTS_JSON: ${{ secrets.CODEX_PROXY_ACCOUNTS_JSON }}
      INPUT_PART: ${{ inputs.part }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar biblioteca de checagem de PNG
        run: python -m pip install --quiet 'Pillow==11.3.0'
      - name: Verificar SHA, Biblia Visual e eixo da lança antes de chamar proxy
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ep01_c01p04_guard_grip_v2 -v
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from videoforge import ep01_c01p04_v3_guard_grip_v2 as engine
          if os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch':
              part=os.environ.get('INPUT_PART','').strip()
          else:
              expected=Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-CORRECAO-PEGADA-C01-P04-V3.json')
              changed=subprocess.check_output(
                  ['git','diff-tree','--no-commit-id','--name-only','-r',os.environ['GITHUB_SHA']],
                  text=True).splitlines()
              if str(expected) not in changed:
                  raise SystemExit('EP01_GRIP_REQUEST_NOT_CHANGED')
              req=json.loads(expected.read_text(encoding='utf-8'))
              if (req.get('schema')!='videoforge/ep01-c01p04-guard-grip-repair-request/v2'
                  or req.get('channel')!='alchemy-lab'
                  or req.get('video_id')!='mmorpg-conquiste-a-princesa-ep01'
                  or req.get('shot_id')!='C01-P04'
                  or req.get('approved_mother_sha256')!=engine.APPROVED_SOURCE_SHA
                  or req.get('single_paid_call') is not True
                  or req.get('retry_on_failure') is not False
                  or req.get('rig_ready') is not False
                  or req.get('youtube_upload') is not False):
                  raise SystemExit('EP01_GRIP_REQUEST_INVALID')
              part=req.get('part','')
          if part not in engine.GUARDS:
              raise SystemExit('EP01_GRIP_UNKNOWN_GUARD')
          old=engine.archived(part)
          if old:
              execute='false'
              print('EP01_GRIP_NO_REPEAT_ARCHIVED',old['sha256'])
          else:
              req=engine.prepare(part)
              execute='true'
              print('EP01_GRIP_PREFLIGHT_SHA_OK',part,len(req['inputs']))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('part='+part+'\n')
              out.write('execute='+execute+'\n')
          PY
      - name: Verificar proxy sem revelar tokens
        if: steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CODEX_PROXY_API_KEY" ]]; then
            echo '::error::CODEX_PROXY_API_KEY ausente'; exit 1
          fi
          if [[ -n "$CODEX_PROXY_BASE_URL" ]]; then
            echo "PROXY_ENDPOINT=$CODEX_PROXY_BASE_URL" >> "$GITHUB_ENV"
          elif [[ -n "$CODEX_PROXY_ACCOUNTS_JSON" ]]; then
            echo 'PROXY_ENDPOINT=http://127.0.0.1:18080' >> "$GITHUB_ENV"
            echo 'USE_EPHEMERAL=1' >> "$GITHUB_ENV"
          else
            echo '::error::Proxy sem contas nem URL'; exit 1
          fi
      - name: Subir proxy efemero em modo publico da Action
        if: steps.preflight.outputs.execute == 'true' && env.USE_EPHEMERAL == '1'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vf-proxy-state"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(os.environ['CODEX_PROXY_ACCOUNTS_JSON'])
          assert isinstance(data,dict) and isinstance(data.get('records'),list)
          assert data['records'] and all(isinstance(r,dict) and isinstance(r.get('token'),dict) for r in data['records'])
          p=Path(os.environ['RUNNER_TEMP'])/'vf-proxy-state'/'accounts.json'
          p.write_text(json.dumps(data),encoding='utf-8')
          p.chmod(0o600)
          PY
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          docker run -d --name vf-proxy-c01p04-grip-v2 \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 \
            -e PROXY_API_KEY="$CODEX_PROXY_API_KEY" -e DATA_DIR=/app/data \
            -e DEBUG_LOG_PAYLOADS=false \
            -v "$RUNNER_TEMP/vf-proxy-state:/app/data:rw" \
            ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1 >/dev/null
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo '::error::Proxy nao iniciou'; exit 1
      - name: Gerar exatamente um guarda RGBA com mao de pegada corrigida
        if: steps.preflight.outputs.execute == 'true'
        env:
          TARGET_PART: ${{ steps.preflight.outputs.part }}
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.proxy_images health --url "$PROXY_ENDPOINT"
          python -m videoforge.ep01_c01p04_v3_guard_grip_v2 --part "$TARGET_PART" --url "$PROXY_ENDPOINT"
      - name: Arquivar PNG e provedor mesmo se a QA reprovar
        if: always() && steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-c01p04-v3-guard-grip-v2 "${{ job.status }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.preflight.outputs.execute == 'true'
        with:
          name: ep01-guard-grip-v2-${{ steps.preflight.outputs.part }}-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens/
          if-no-files-found: warn
          retention-days: 30
      - name: Limpar contas temporarias
        if: always()
        shell: bash
        run: |
          docker rm -f vf-proxy-c01p04-grip-v2 >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vf-proxy-state"
