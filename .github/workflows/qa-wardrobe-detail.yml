name: "VideoForge - comparar detalhes das roupas de Aldric e Elara"
on:
  push:
    branches: [main]
    paths:
      - 'videoforge/wardrobe_detail_qa.py'
      - 'tests/test_wardrobe_detail_qa.py'
      - '.github/workflows/qa-wardrobe-detail.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vf-alchemy-wardrobe-detail-qa
  cancel-in-progress: false
jobs:
  wardrobe-comparison:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow somente para gerar quadros derivados offline
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Testar imagens existentes, SHA, bloqueio e determinismo
        run: python -m unittest tests.test_wardrobe_detail_qa tests.test_wardrobe_inventory tests.test_wardrobe_review -v
      - name: Montar detalhes das roupas usando arquivos PNG imutaveis
        run: python -m videoforge.wardrobe_detail_qa --sync
      - name: Arquivar duas pranchas derivadas e um manifesto QA
        shell: bash
        run: |
          set -euo pipefail
          EP=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'videoforge-qa[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EP/QA-ALDRIC-ROUPA-DETALE-V2.jpg" "$EP/QA-ELARA-PEITORAL-ROXO-V2.jpg"
          git add "$EP/QA-FIGURINO-DETALHES-V2.json" "$EP/REVISAR-DETALHES-FIGURINOS-V2.md"
          if git diff --cached --quiet; then
            echo 'Imagens de QA ja arquivadas.'
            exit 0
          fi
          git commit -m 'qa(dorama): arquivar comparativo de vestes existentes sem gerar arte'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
