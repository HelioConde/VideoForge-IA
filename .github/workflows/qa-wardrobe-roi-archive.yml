name: "VideoForge - verificar arquivos ROI V3 arquivados"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'videoforge/wardrobe_roi_archive.py'
      - 'tests/test_wardrobe_roi_archive.py'
      - '.github/workflows/qa-wardrobe-roi-archive.yml'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-ROI-EXCLUSOES-V3.json'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/qa-roi-exclusions-v3/**'
permissions:
  contents: read
jobs:
  verify-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar dependencia de leitura offline
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Testar integridade e recusa de aprovacoes indevidas
        run: python -m unittest tests.test_wardrobe_roi_archive tests.test_wardrobe_roi_exclusions -v
      - name: Validar oito PNGs V3 ja versionados
        run: python -m videoforge.wardrobe_roi_archive --sync
      - name: Disponibilizar auditoria sem alterar repositorio
        uses: actions/upload-artifact@v4
        with:
          name: qa-roi-v3-archive-check
          path: canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-ROI-ARQUIVO-REMOTO-V3.json
          retention-days: 30
