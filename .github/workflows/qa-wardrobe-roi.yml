name: "VideoForge - previsualizar ROI barba e roupa sem gerar IA"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'videoforge/wardrobe_roi_review.py'
      - 'tests/test_wardrobe_roi_review.py'
      - '.github/workflows/qa-wardrobe-roi.yml'
permissions:
  contents: write
concurrency:
  group: vf-wardrobe-roi
  cancel-in-progress: false
jobs:
  qa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow apenas para inspecao de imagens existentes
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Verificar SHA e evitar atribuir barba sem mascara
        run: python -m unittest tests.test_wardrobe_roi_review tests.test_wardrobe_pixel_audit -v
      - name: Criar pranchas offline com ROIs provisorias
        run: python -m videoforge.wardrobe_roi_review --sync
      - name: Salvar pranchas e checklist de ROIs no episodio
        shell: bash
        run: |
          set -euo pipefail
          EP=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'videoforge-roi-qa[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EP/QA-ALDRIC-ROI-PROPOSTAS-V2.jpg" "$EP/QA-ELARA-ROI-CENAS-V2.jpg"
          git add "$EP/QA-ROI-FIGURINOS-V2.json" "$EP/REVISAR-ROI-FIGURINOS-V2.md"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(dorama): arquivar regioes candidatas em cenas reais sem IA'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
