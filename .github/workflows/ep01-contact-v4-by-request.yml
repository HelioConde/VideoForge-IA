name: "VideoForge - EP01 reparar contato bainha V4"
run-name: "EP01 / nova candidata de contato C01-P02 V4"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-REPARO-CONTATO-V4.json'
permissions:
  contents: write
  packages: read
concurrency:
  group: ep01-contact-repair-v4-main
  cancel-in-progress: false
jobs:
  repair-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      CODEX_PROXY_BASE_URL: ${{ secrets.CODEX_PROXY_BASE_URL }}
      CODEX_PROXY_ACCOUNTS_JSON: ${{ secrets.CODEX_PROXY_ACCOUNTS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow para edição local de pixels fora do contato
        run: python -m pip install --quiet --disable-pip-version-check Pillow==11.3.0
      - name: "Pré-voo: rejeições 2 e 4, SHA e bloqueio de repetição paga"
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ep01_contact_repair_v4 -v
          python - <<'PY'
          import json,os
          from pathlib import Path
          from videoforge import ep01_contact_repair_v4 as rep
          from videoforge.image_generation_policy import assert_image_generation_allowed
          assert_image_generation_allowed(rep.CHANNEL,rep.VIDEO)
          request_path=Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-REPARO-CONTATO-V4.json')
          data=json.loads(request_path.read_text(encoding='utf-8'))
          if (data.get('schema')!='videoforge/ep01-contact-repair-request/v1'
              or data.get('source_mother_sha256')!=rep.EXPECTED_MOTHER_SHA
              or data.get('source_v3_patch_sha256')!=rep.V3_SHA
              or data.get('shot_id')!='C01-P02'
              or data.get('requested_version')!='v4'
              or data.get('max_chargeable_calls_per_run')!=1
              or data.get('retry_on_429') is not False
              or data.get('human_approval') is not False
              or data.get('youtube_upload') is not False):
              raise SystemExit('EP01_CONTACT_V4_REQUEST_INVALID')
          previous=rep.archived_candidate()
          if previous:
              execute='false'
              print('EP01_CONTACT_V4_ALREADY_ARCHIVED_NO_NEW_CALL',previous)
          else:
              spec=rep.prepare()
              execute='true'
              print('EP01_CONTACT_V4_SOURCE_VERIFIED',spec['source_sha256'],'source','v3-local-patch')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('execute='+execute+'\n')
          PY
      - name: Verificar configuracao do Codex Proxy sem revelar credenciais
        if: steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CODEX_PROXY_API_KEY" ]]; then
            echo "::error::CODEX_PROXY_API_KEY ausente"
            exit 1
          fi
          if [[ -n "$CODEX_PROXY_BASE_URL" ]]; then
            echo 'Modo: proxy persistente'
            printf 'PROXY_ENDPOINT=%s\n' "$CODEX_PROXY_BASE_URL" >> "$GITHUB_ENV"
          elif [[ -n "$CODEX_PROXY_ACCOUNTS_JSON" ]]; then
            echo 'Modo: proxy efemero autorizado'
            echo 'PROXY_ENDPOINT=http://127.0.0.1:18080' >> "$GITHUB_ENV"
            echo 'USE_EPHEMERAL=1' >> "$GITHUB_ENV"
          else
            echo "::error::Falta CODEX_PROXY_BASE_URL ou CODEX_PROXY_ACCOUNTS_JSON"
            exit 1
          fi
      - name: Iniciar proxy precompilado se necessario
        if: steps.preflight.outputs.execute == 'true' && env.USE_EPHEMERAL == '1'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vf-proxy-state"
          python - <<'PY'
          import json,os
          from pathlib import Path
          value=json.loads(os.environ['CODEX_PROXY_ACCOUNTS_JSON'])
          assert isinstance(value,dict) and isinstance(value.get('records'),list)
          assert value['records'] and all(isinstance(r,dict) and isinstance(r.get('token'),dict) for r in value['records'])
          p=Path(os.environ['RUNNER_TEMP'])/'vf-proxy-state'/'accounts.json'
          p.write_text(json.dumps(value),encoding='utf-8')
          p.chmod(0o600)
          PY
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          docker run -d --name vf-proxy-ep01-contact-v4 \
            --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 \
            -e PROXY_API_KEY="$CODEX_PROXY_API_KEY" -e DATA_DIR=/app/data \
            -e DEBUG_LOG_PAYLOADS=false \
            -v "$RUNNER_TEMP/vf-proxy-state:/app/data:rw" \
            ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1 >/dev/null
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Proxy nao respondeu /health/live"
          exit 1
      - name: Editar somente a região de contato (uma única chamada paga)
        if: steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.proxy_images health --url "$PROXY_ENDPOINT"
          python -m videoforge.ep01_contact_repair_v4 --url "$PROXY_ENDPOINT"
      - name: Arquivar candidatos V4 com SHA, preservar V1/arquivos antigos
        if: always() && steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-contact-repair-v4 "${{ job.status }}"
      - name: Guardar artefatos originais do reparo candidato
        if: always() && steps.preflight.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ep01-contact-v4-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens/
          retention-days: 14
          if-no-files-found: warn
      - name: Limpar tokens efêmeros
        if: always()
        shell: bash
        run: |
          docker rm -f vf-proxy-ep01-contact-v4 >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vf-proxy-state"
