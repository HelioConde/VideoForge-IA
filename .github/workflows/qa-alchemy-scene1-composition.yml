name: "VideoForge - QA recomposição C01 (somente leitura, sem imagens novas)"
on:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-qa-composicao-c01.json'

permissions:
  contents: write

concurrency:
  group: vf-alchemy-neutral-composite-qa-c01
  cancel-in-progress: false

jobs:
  auditar-composicao:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar política de não geração e pedido de auditoria
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01")
          d=json.loads((base/"pedido-qa-composicao-c01.json").read_text(encoding="utf8"))
          assert (base/"SEM-GERACAO-NOVAS-IMAGENS.lock").is_file()
          assert d.get("schema")=="videoforge/qa-neutral-composite-request/v1"
          assert d.get("channel")=="alchemy-lab"
          assert d.get("video_id")=="mmorpg-conquiste-a-princesa-ep01"
          assert d.get("image_generation_calls")==0
          assert d.get("read_only_png_files") is True
          assert d.get("youtube_upload") is False
          assert d.get("human_visual_approval") is False
          print("QA_READ_ONLY; no AI; no sprite export; no new image")
          PY
      - name: Preparar bibliotecas de cálculos pixel-a-pixel
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            Pillow==11.3.0 numpy==2.2.6
      - name: Medir diferenças entre composição neutra e cena-mãe original
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.qa_scene1_composition
      - name: Versionar relatório JSON no canal
        shell: bash
        run: |
          set -euo pipefail
          FILE='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/qa-recomposicao-c01.json'
          test -s "$FILE"
          git config user.name 'videoforge-archive[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$FILE"
          if git diff --cached --quiet; then
            echo "Relatorio ja presente"
            exit 0
          fi
          git commit -m 'qa(alchemy): registrar erro de recomposição neutra dos pixels originais'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Garantir que MP4 oficial permaneça bloqueado
        run: |
          echo 'Métricas são diagnóstico. Não aprovar rigs, não gerar imagens, não publicar vídeo.'
