name: "VideoForge - QA cena-mae real EP01"
run-name: "EP01 / prévia da cena-mãe C01-P02"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-ep01-scene-mother-preview.yml'
permissions:
  contents: write
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow para reduzir PNG local, nunca imagem IA
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Validar PNG SHA e construir JPG de revisão
        run: python scripts/gerar-previa-cena-mae-ep01.py
      - name: Arquivar somente prévia e QA (PNG original intocado)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'videoforge-mother-qa[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          EP=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git add -- "$EP/QA-C01-P02-CENA-MAE.jpg" "$EP/QA-C01-P02-CENA-MAE.json"
          if git diff --cached --quiet; then
            echo "EP01_MOTHER_JPG_PREVIEW_ALREADY_UP_TO_DATE"
            exit 0
          fi
          git commit -m 'qa(ep01): prévia leve SHA-verificada da primeira cena-mãe'
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
          done
          exit 1
