name: "VideoForge - EP01 C01-P04 V3 registrar escala por silhueta QA"
run-name: "EP01 C01-P04 / comparar escala Aldric e guardas"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-REGISTRO-SILHUETAS-C01-P04-V3.json'

permissions:
  contents: write

concurrency:
  group: ep01-c01p04-v3-subject-registration-main
  cancel-in-progress: false

jobs:
  scale-candidates:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'Pillow==11.3.0'
      - name: QA da geometria com Python (sem chamadas ao proxy)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa_ep01_c01p04_v3_subject_registration.py
      - name: Salvar a prancha e os dados no canal
        shell: bash
        run: |
          set -euo pipefail
          ep=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$ep/QA-C01-P04-V3-REGISTRO-SILHUETAS.jpg" "$ep/QA-C01-P04-V3-REGISTRO-SILHUETAS-PREVIEW.jpg" "$ep/QA-C01-P04-V3-REGISTRO-SILHUETAS.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(ep01): candidatas escala proporcional de guardas e Aldric sem rig'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep01-c01p04-v3-silhouette-review
          path: canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-C01-P04-V3-REGISTRO-SILHUETAS*
          retention-days: 30
          if-no-files-found: warn
