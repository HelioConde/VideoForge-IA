name: "VideoForge - referencias cinematograficas de Kael e Elara (somente originais)"
on:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-validar-referencias-chat.json'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/referencias/chat-aprovadas/**'
      - 'uploads/alchemy-ep01-refs-estilo.zip'
      - 'uploads/alchemy-ep01-cinema-3-originais.zip'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: vf-cinema-chat-reference-originals
  cancel-in-progress: false

jobs:
  verify-or-import-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirmar importacao somente dos originais no remake V2 autorizado
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01')
          p=json.loads((base/'pedido-validar-referencias-chat.json').read_text(encoding='utf8'))
          assert p['schema']=='videoforge/chat-style-reference-qa-request/v1'
          assert p['source_images_expected']==2
          assert p['no_generate_images'] is True
          assert p['no_edit_pixels'] is True
          assert p['render_mp4'] is False
          assert p['youtube_upload'] is False
          assert (base/'REMAKE-EP01-HISTORICO-BLOQUEIO-2026-11-14.md').is_file()
          assert not (base/'SEM-GERACAO-NOVAS-IMAGENS.lock').exists()
          state=json.loads((base/'estado-atual.json').read_text(encoding='utf8'))
          policy=json.loads((base/'autonomy-policy.json').read_text(encoding='utf8'))
          assert state['active_production_version']=='remake-v2-20261115'
          assert state['locks']['no_new_image_generation'] is False
          assert state['locks']['no_youtube_upload'] is True
          assert policy['paid_provider_calls_approved'] is True
          print('ONLY_IMPORT_ORIGINAL_SHA; this workflow NEVER generates images; V2 provider policy preserved')
          PY
      - name: Instalar Pillow somente para leitura do fingerprint de referencias
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Validar originais e fingerprint sem gerar imagens
        run: python -m unittest tests.test_cinematic_chat_references tests.test_cinematic_reference_fingerprint -v
      - name: Importar somente se o ZIP original estiver no GitHub
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f uploads/alchemy-ep01-cinema-3-originais.zip || -f uploads/alchemy-ep01-refs-estilo.zip ]]; then
            python -m videoforge.import_cinematic_chat_references
          else
            echo 'ZIP ainda não enviado. Não importar arquivos simulados.'
          fi
      - name: Auditar RGB PNG exatos, SHA e dimensoes
        run: python -m videoforge.cinematic_chat_references --report
      - name: Registrar cores, dHash e integridade dos tres originais
        run: python -m videoforge.cinematic_reference_fingerprint --report
      - name: Verificar que referencia estetica nao libera MP4 nem rigs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01')
          r=json.loads((base/'qa-referencias-chat-cinematograficas.json').read_text(encoding='utf8'))
          assert r['source_has_final_9_16_aspect_not_old_2_3'] is True
          assert r['original_source_files_total']==2
          assert r['generated_or_modified_pixels']==0
          assert r['new_image_generation_calls']==0
          assert r['render_official_allowed'] is False
          assert r['official_character_bible_updated'] is False
          assert r['import_read_only'] is True
          assert r['active_remake_version']=='remake-v2-20261115'
          candidate=r['camera_candidate_C12_P02']
          assert candidate['shot_id']=='C12-P02'
          assert candidate['human_shot_approval'] is False
          assert candidate['rig_approved'] is False
          assert candidate['status'] in ('UPLOAD_PENDING','EXACT_SOURCE_ARCHIVED')
          print('CAMERA_C12_STATUS',candidate['status'])
          print('SOURCE_STATUS',r['status'],'ORIGINALS_VERIFIED',r['original_source_files_sha_verified'])
          PY
      - name: Arquivar exclusivamente os PNGs originais verificados e o QA
        shell: bash
        run: |
          set -euo pipefail
          FILE='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/qa-referencias-chat-cinematograficas.json'
          DIR='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/referencias/chat-aprovadas'
          git config user.name 'videoforge-archive[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$FILE" 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/qa-fingerprints-referencias.json'
          if [[ -d "$DIR" ]]; then
            git add -f -- "$DIR"
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(alchemy): arquivar originais de estilo SHA-verificados sem gerar imagens'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
