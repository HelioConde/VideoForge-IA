name: "VideoForge - revisao tripla das identidades da V2"
on:
  push:
    branches: [main]
    paths:
      - 'videoforge/grounded_review.py'
      - 'tests/test_grounded_review.py'
      - '.github/workflows/qa-grounded-identity-review.yml'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/geracoes/production-art-request/**'
  workflow_run:
    workflows:
      - "VideoForge - arte de referencia por pedido do canal"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: vf-alchemy-grounded-review
  cancel-in-progress: false

jobs:
  compare-grounded:
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow somente para previews locais
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Testar SHA e proveniencia da nova candidata
        run: python -m unittest tests.test_grounded_review -v
      - name: Gerar comparacoes JPEG de tres fontes, sem modelo IA
        run: python -m videoforge.grounded_review --sync
      - name: Gravar QA no canal, preservando originais
        shell: bash
        run: |
          set -euo pipefail
          EP=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'videoforge-qa[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in QA-KAEL-TRIPLO-V2.jpg QA-ELARA-TRIPLO-V2.jpg QA-IDENTIDADE-GROUNDED-V2.json REVISAR-GROUNDED-V2.md; do
            git add -- "$EP/$f"
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(dorama): original vs texto vs prancha com fontes PNG'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Guardar evidencias offline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-v2-grounded-qa-${{ github.run_id }}
          path: |
            canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-*-TRIPLO-V2.jpg
            canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-IDENTIDADE-GROUNDED-V2.json
            canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/REVISAR-GROUNDED-V2.md
          retention-days: 30
          if-no-files-found: warn
