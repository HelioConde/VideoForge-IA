name: "VideoForge - refinar máscaras do figurino por cor sem IA"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'videoforge/wardrobe_roi_refine.py'
      - 'tests/test_wardrobe_roi_refine.py'
      - '.github/workflows/qa-wardrobe-roi-refine.yml'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/ROI-POLIGONOS-CANDIDATOS-V2.json'
permissions:
  contents: write
concurrency:
  group: vf-wardrobe-roi-refine
  cancel-in-progress: false
jobs:
  refine-existing-pixels:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencia offline
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Testar cor, mascara, SHA e nao aprovacao
        run: python -m unittest tests.test_wardrobe_roi_refine -v
      - name: Gerar recortes PNG transparentes e prancha, sem IA
        run: python -m videoforge.wardrobe_roi_refine --sync
      - name: Persistir somente as oito mascaras candidatas e QA
        shell: bash
        run: |
          set -euo pipefail
          EP=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'videoforge-roi-qa[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$EP/assets/qa-roi-figurino-v2/"
          git add "$EP/QA-ROI-MASCARAS-REFINADAS-V2.jpg" "$EP/QA-ROI-MASCARAS-REFINADAS-V2.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(dorama): registrar oito mascaras cromaticas para revisao'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
