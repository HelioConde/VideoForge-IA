name: "EP01 C08-P02 - seven real RGBA candidate cutouts (QA pending)"

on:
  pull_request:
    paths:
      - '.github/workflows/ep01-cart-rgba-candidates.yml'
      - 'videoforge/ep01_cart_rgba_candidates.py'
      - 'tests/test_ep01_cart_rgba_candidates.py'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PROPOSTA-MOVIMENTO-C07-C08-V1.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep01-cart-rgba-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-source-layer-candidates:
    if: >-
      github.repository == 'HelioConde/VideoForge-IA'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      AI_ENABLED: 'false'
      PAID_CALLS_ENABLED: 'false'
      CODEX_PROXY_TEXT_AUTHORIZED: 'false'
      IMAGE_GENERATION_ENABLED: 'false'
      YOUTUBE_PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline segmentation and image IO libraries
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0
      - name: Run source fidelity, real alpha and independent approval-gate tests
        run: |
          python -m unittest discover -s tests -p 'test_ep01_cart_rgba_candidates.py' -v
          python -m unittest discover -s tests -p 'test_ep01_cart_kinematics.py' -v
      - name: Extract genuine RGBA candidates from pinned original PNG (no inference)
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.ep01_cart_rgba_candidates \
            --output-dir "$RUNNER_TEMP/ep01-cart-rgba-candidates"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from PIL import Image
          output=Path(os.environ['RUNNER_TEMP'])/'ep01-cart-rgba-candidates'
          data=json.loads((output/'qa.json').read_text(encoding='utf-8'))
          assert len(data['layer_order'])==7
          assert data['source_pose_recomposes_bit_exact'] is True
          assert data['source_pose_pixel_error']==0
          assert data['source_sha256']==data['source_sha256_after']
          assert data['original_visual_bible_master_approved'] is False
          assert data['background_underlay_art_quality_verified'] is False
          assert data['semantic_silhouettes_verified'] is False
          assert data['independent_visual_qa']=='required_not_completed'
          assert data['rig_ready'] is False and data['production_ready'] is False
          assert data['real_model_requests']==0 and data['youtube_publications']==0
          assert data['original_png_overwrites']==0
          for name in data['layer_order']:
              layer=output/(name+'.png')
              with Image.open(layer) as im:
                  assert im.mode=='RGBA' and im.size==(1053,1493)
              assert hashlib.sha256(layer.read_bytes()).hexdigest()==data['layer_output_sha256'][name]
          assert (output/'semantic-mask-overlay.jpg').is_file()
          assert (output/'six-cutouts-contact.jpg').is_file()
          print('Seven native RGBA candidate files generated and SHA verified; visual/rig approval remains false.')
          PY
      - name: Archive seven layers plus overlays and independent QA checklist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-cart-seven-rgba-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/ep01-cart-rgba-candidates/
          retention-days: 14
          if-no-files-found: error
