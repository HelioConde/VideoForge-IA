name: "VideoForge - separar braços dos guardas com pixels existentes"
on:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-separar-bracos-guardas.json'

permissions:
  contents: write

concurrency:
  group: vf-alchemy-guard-arms-existing-only
  cancel-in-progress: false

jobs:
  separar-bracos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bloqueio de imagens e validação da solicitação
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01')
          req=json.loads((root/'pedido-separar-bracos-guardas.json').read_text(encoding='utf8'))
          assert req.get('schema')=='videoforge/guard-arm-existing-pixel-request/v1'
          assert req.get('channel')=='alchemy-lab'
          assert req.get('video_id')=='mmorpg-conquiste-a-princesa-ep01'
          assert req.get('image_generation_calls')==0
          assert req.get('only_existing_source_pixels') is True
          assert req.get('human_visual_approval') is False
          assert req.get('youtube_upload') is False
          assert (root/'SEM-GERACAO-NOVAS-IMAGENS.lock').is_file()
          print('Only existing source pixels; no generative image models')
          PY
      - name: Preparar recorte determinístico com Pillow
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Recortar membros e conferir recomposição sem perda
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.split_existing_guard_arms
      - name: Versionar 8 PNGs e laudo no diretório Alchemy Lab
        shell: bash
        run: |
          set -euo pipefail
          DEST='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/cena-01/rig-drafts/guard-arm-parts'
          git config user.name 'videoforge-archive[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$DEST"
          if git diff --cached --quiet; then
            echo 'Arquivos já idênticos, nenhuma alteração'
            exit 0
          fi
          git commit -m 'assets(alchemy): separar oito camadas de braços dos guardas sem gerar arte'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Não promover rascunho a rig oficial
        run: |
          echo 'Braços são rascunhos. As mãos e braços atrás das lanças não têm underlay.'
