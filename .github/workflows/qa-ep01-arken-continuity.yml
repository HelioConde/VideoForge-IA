name: "VideoForge - EP01 QA Arken continuidade (sem IA)"
on:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-QA-C05-ARKEN.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ep01-arken-qa
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for offline QA
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Check no paid calls or automatic promotion
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-QA-C05-ARKEN.json').read_text())
          assert r.get('schema')=='videoforge/ep01-arken-visual-qa-request/v1'
          assert r.get('sources')==['C05-P01','biblia-arken-muralhas-base-v1','C05-P02']
          assert r.get('no_provider_calls') is True
          assert r.get('human_visual_approval') is False
          assert r.get('rig_ready') is False
          assert r.get('youtube_upload') is False
          print('QA_ONLY_NO_PROXY')
          PY
      - name: Generate visual contact sheet with SHA provenance
        run: python -m scripts.qa_ep01_arken_continuity
      - name: Commit Arken image comparison without approval
        shell: bash
        run: |
          set -euo pipefail
          EP="canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01"
          git add "$EP/QA-C05-ARKEN-CONTINUIDADE.jpg" "$EP/QA-C05-ARKEN-CONTINUIDADE.json"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'videoforge-qa[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa(ep01): comparar mestre Arken, estrada e tomada C05-P02'
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
      - name: Backup QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ep01-arken-${{ github.run_id }}
          path: |
            canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-C05-ARKEN-CONTINUIDADE.jpg
            canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-C05-ARKEN-CONTINUIDADE.json
          retention-days: 14
          if-no-files-found: warn
