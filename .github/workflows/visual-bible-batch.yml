name: "VideoForge - Biblia Visual gerar mestres em lotes"
run-name: "Bíblia Visual / mestres / cursor ${{ inputs.cursor || '0' }}"
on:
  workflow_dispatch:
    inputs:
      cursor:
        description: "Posição inicial da fila de referências independentes"
        type: string
        required: true
        default: "0"
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/biblia-visual/FILA-GERACAO-MESTRES.json'
permissions:
  contents: read
  actions: write
concurrency:
  group: alchemy-bible-master-queue-main
  cancel-in-progress: false
jobs:
  gerar-mestres:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QUEUE_CURSOR: ${{ inputs.cursor || '0' }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: alchemy-lab
      VIDEO_ID: mmorpg-conquiste-a-princesa-ep01
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar fila, plano e categorias antes de gerar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from videoforge.production_art import read_plan
          q = json.loads(Path('canal/alchemy-lab/biblia-visual/FILA-GERACAO-MESTRES.json').read_text(encoding='utf-8'))
          plan, _ = read_plan('alchemy-lab','mmorpg-conquiste-a-princesa-ep01')
          if q.get('schema') != 'videoforge/bible-master-queue/v1' or q.get('channel') != 'alchemy-lab':
              raise SystemExit('BIBLE_BATCH_QUEUE_INVALID')
          by_id = {item['id']:item for item in plan['assets']}
          entries = q.get('items')
          if not isinstance(entries,list) or len(entries)!=len({e.get('asset_id') for e in entries}):
              raise SystemExit('BIBLE_BATCH_DUPLICATE_OR_INVALID')
          for e in entries:
              asset = by_id.get(e.get('asset_id'))
              if e.get('phase')=='independent_master':
                  if not asset or asset.get('source_mode')!='dorama-visual-bible-edit-v1':
                      raise SystemExit('BIBLE_BATCH_MISSING_MASTER_ASSET '+str(e.get('asset_id')))
                  if (asset.get('biblia_categoria')!=e.get('category')
                          or asset.get('biblia_item_id')!=e.get('item')
                          or asset.get('human_visual_approval_required') is not True
                          or asset.get('youtube_upload') is not False):
                      raise SystemExit('BIBLE_BATCH_ASSET_SCOPE_INCONSISTENT')
          independent = [e for e in entries if e['phase']=='independent_master']
          if len(independent)!=42:
              raise SystemExit('BIBLE_BATCH_EXPECTED_42_INDEPENDENT_REFERENCES')
          print('BIBLE_BATCH_VALIDATED',len(independent),'independent',len(entries)-len(independent),'deferred')
          PY
      - name: Processar até quatro referências em sequência
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(python - <<'PY'
          import json
          q=json.load(open('canal/alchemy-lab/biblia-visual/FILA-GERACAO-MESTRES.json',encoding='utf-8'))
          for item in q['items']:
              if item['phase']=='independent_master':
                  print(item['asset_id'])
          PY
          )
          total="${#ASSETS[@]}"
          cursor="${QUEUE_CURSOR}"
          if ! [[ "$cursor" =~ ^[0-9]+$ ]] || ((cursor >= total)); then
            echo "::error::Invalid queue cursor $cursor/$total"
            exit 2
          fi
          end=$((cursor+4))
          if ((end>total)); then end="$total"; fi
          echo "BIBLE_BATCH_START cursor=$cursor end=$end total=$total"
          for ((i=cursor;i<end;i++)); do
            asset="${ASSETS[$i]}"
            state=$(python - "$asset" <<'PY'
          import sys
          from videoforge.production_art import archived_reference
          item=archived_reference('alchemy-lab','mmorpg-conquiste-a-princesa-ep01',sys.argv[1])
          print('ARCHIVED_SHA_VERIFIED' if item else 'NOT_GENERATED')
          PY
            )
            if [[ "$state" == "ARCHIVED_SHA_VERIFIED" ]]; then
              echo "BIBLE_MASTER_ALREADY_ARCHIVED_NO_REPEAT $asset"
              continue
            fi
            if [[ "$state" != "NOT_GENERATED" ]]; then
              echo "::error::Invalid archived status for $asset"
              exit 2
            fi
            tag="${GITHUB_RUN_ID}-${i}"
            title="Arte Bíblia $asset $tag"
            echo "BIBLE_MASTER_DISPATCH $asset tag=$tag"
            gh workflow run production-art-by-request.yml -R "$GH_REPO" --ref main \
              -f channel="$CHANNEL" -f video_id="$VIDEO_ID" -f asset="$asset" -f request_tag="$tag"
            runid=""
            for attempt in $(seq 1 60); do
              runid=$(gh api "repos/$GH_REPO/actions/workflows/production-art-by-request.yml/runs?event=workflow_dispatch&per_page=60" \
                | jq -r --arg title "$title" '[.workflow_runs[] | select(.display_title == $title)][0].id // empty')
              if [[ -n "$runid" ]]; then break; fi
              sleep 10
            done
            if [[ -z "$runid" ]]; then
              echo "::error::Cannot find dispatched run for $asset; STOP without another call"
              exit 1
            fi
            echo "BIBLE_MASTER_RUN $asset run=$runid"
            if ! gh run watch "$runid" -R "$GH_REPO" --exit-status --interval 10; then
              echo "::error::Generation or archive failed for $asset in run $runid. STOP, no automatic paid retry."
              exit 1
            fi
            echo "BIBLE_MASTER_TECHNICAL_SUCCESS_VISUAL_REVIEW_PENDING $asset run=$runid"
          done
          # Atualizar galeria ao concluir cada lote, sem imagem paga.
          # Falha na galeria não interrompe produção; sempre registrar aviso.
          if ! gh workflow run qa-visual-bible-gallery.yml -R "$GH_REPO" --ref main; then
            echo "::warning::Falha ao solicitar galeria; imagens originais permanecem arquivadas"
          else
            echo "BIBLE_GALLERY_DISPATCHED_FOR_REVIEW count=$end/$total"
          fi
          if ((end<total)); then
            echo "BIBLE_BATCH_CONTINUE next_cursor=$end"
            gh workflow run visual-bible-batch.yml -R "$GH_REPO" --ref main -f cursor="$end"
          else
            echo "BIBLE_INDEPENDENT_MASTERS_ALL_VISITED count=$total"
            echo "INTERACTIONS_AND_SCENE_SHOTS_REMAIN_BLOCKED_FOR_HUMAN_VISUAL_APPROVAL"
            # Só após 42 mestres, disparar 4 correções V2 identificadas
            # por QA: Kael moderno e lança com base portátil.
            # A própria fila de correção também verifica 42 arquivos SHA.
            gh workflow run visual-bible-repairs.yml -R "$GH_REPO" --ref main
            echo "BIBLE_REPAIRS_V2_DISPATCHED_AFTER_ALL_42_MASTERS"
          fi
