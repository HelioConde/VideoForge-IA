name: Preparar imagem VideoForge MP4 (build unico)
on:
  push:
    branches: [main]
    paths:
      - 'infra/containers/Dockerfile.media'
      - '.github/workflows/media-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: videoforge-media-image-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagem Python + FFmpeg em GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/Dockerfile.media
          push: true
          tags: ghcr.io/helioconde/videoforge-media-runner:ubuntu2404-ffmpeg-v2
          cache-from: type=gha,scope=videoforge-media
          cache-to: type=gha,mode=max,scope=videoforge-media
      - name: Verificar que Python e FFmpeg ja estao instalados
        run: |
          docker run --rm ghcr.io/helioconde/videoforge-media-runner:ubuntu2404-ffmpeg-v2 sh -ec '
            python -c "import sys; assert sys.version_info[:2] == (3,12)"
            ffmpeg -version | head -n 1
            ffmpeg -version | head -n 1 | grep -E 'ffmpeg version 6\\.'
            ffprobe -version | head -n 1
            fc-list | head -n 1
          '
