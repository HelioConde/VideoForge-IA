name: Disparar teste unico de imagem via Codex Proxy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-image-test.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Solicitar uma imagem ao workflow principal sem duplicar secrets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/proxy-images.yml/dispatches" \
            --field ref=main \
            --field 'inputs[modo]=ephemeral' \
            --field 'inputs[operacao]=generate' \
            --field 'inputs[canal]=otaku-br' \
            --field 'inputs[video_id]=teste-proxy-20261113' \
            --field 'inputs[cena]=cena-01' \
            --field 'inputs[modelo]=gpt-image-2' \
            --field 'inputs[tamanho]=1024x1536' \
            --field 'inputs[prompt]=Ilustracao original em estilo anime de um jovem aventureiro com capa vermelha sobre um telhado de uma cidade de fantasia ao por do sol, aparencia consistente, arte digital cinematografica vertical, sem personagens protegidos, sem letras ou logos.'
          echo 'Workflow principal de imagem solicitado ao GitHub.'
