name: "VideoForge - auditar rigs Alchemy por SHA (sem imagens)"
on:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-validar-rig.json'

permissions:
  contents: write

concurrency:
  group: vf-alchemy-rig-qa
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar solicitação apenas de QA
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path(
           'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-validar-rig.json'
           ).read_text(encoding='utf8'))
          assert doc['schema']=='videoforge/rig-qa-only-request/v1'
          assert doc['image_generation_calls']==0
          assert doc['official_render_allowed'] is False
          assert doc['youtube_upload'] is False
          print('QA_ONLY_NO_IMAGE_GENERATION')
          PY
      - name: Auditar PNGs, SHA256, transparência e coordenadas
        shell: bash
        run: |
          set -euo pipefail
          REPORT='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/rig-inventario-c01.qa.json'
          python -m videoforge.rig_inventory_validator --write-report "$REPORT"
      - name: Guardar relatório sem aprovar rig
        shell: bash
        run: |
          set -euo pipefail
          REPORT='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/rig-inventario-c01.qa.json'
          git config user.name 'videoforge-archive[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$REPORT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(alchemy): auditar SHA e bloquear rigs nao aprovados'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
