# LEGADO SOMENTE PARA AUDITORIA HISTÓRICA. Não executar geração/recorte.
# Política oficial: docs/CONTRATO-CAMADAS-GERADAS-PELO-PROXY.md
name: "VideoForge - EP01 extrair camada da cena-mae"
run-name: "EP01 layer ${{ inputs.part }} ${{ inputs.request_tag || github.run_id }}"
on:
  workflow_dispatch:
    inputs:
      part:
        type: choice
        required: true
        options: [background-clean, character-carrasco, object-espada]
        default: background-clean
      request_tag:
        required: false
        type: string
        default: ""
permissions:
  contents: write
  packages: read
concurrency:
  group: ep01-layer-extraction-${{ github.ref }}
  cancel-in-progress: false
jobs:
  extrair-camada:
    if: false  # DESATIVADO: candidato legado V1 não aprovado para rig
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      CODEX_PROXY_BASE_URL: ${{ secrets.CODEX_PROXY_BASE_URL }}
      CODEX_PROXY_ACCOUNTS_JSON: ${{ secrets.CODEX_PROXY_ACCOUNTS_JSON }}
      INPUT_PART: ${{ inputs.part }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow para alinhamento de ate 2px sem reamostragem
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Testar origem da mãe SHA e validar camada sem pagar
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ep01_shot_layers -v
          python - <<'PY'
          import os
          from videoforge import ep01_shot_layers as engine
          from videoforge.image_generation_policy import assert_image_generation_allowed
          part=os.environ['INPUT_PART']
          assert_image_generation_allowed(engine.CHANNEL,engine.VIDEO)
          previous=engine.archived_layer(part)
          if previous:
              execute='false'
              print('EP01_LAYER_SHA_ARCHIVED_SKIP',part,previous['sha256'])
          else:
              spec=engine.prepare(part)
              execute='true'
              print('EP01_LAYER_SHA_PREFLIGHT',part,spec['source_sha256'],
                    'canvas',spec['dimensions'],'paid_calls=1')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('part='+part+'\nexecute='+execute+'\n')
          PY
      - name: Verificar configuracao do Codex Proxy sem revelar credenciais
        if: steps.request.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CODEX_PROXY_API_KEY" ]]; then
            echo "::error::CODEX_PROXY_API_KEY ausente"
            exit 1
          fi
          if [[ -n "$CODEX_PROXY_BASE_URL" ]]; then
            echo 'Modo: proxy persistente'
            printf 'PROXY_ENDPOINT=%s\n' "$CODEX_PROXY_BASE_URL" >> "$GITHUB_ENV"
          elif [[ -n "$CODEX_PROXY_ACCOUNTS_JSON" ]]; then
            echo 'Modo: proxy efemero autorizado'
            echo 'PROXY_ENDPOINT=http://127.0.0.1:18080' >> "$GITHUB_ENV"
            echo 'USE_EPHEMERAL=1' >> "$GITHUB_ENV"
          else
            echo "::error::Falta CODEX_PROXY_BASE_URL ou CODEX_PROXY_ACCOUNTS_JSON"
            exit 1
          fi
      - name: Iniciar proxy precompilado se necessario
        if: steps.request.outputs.execute == 'true' && env.USE_EPHEMERAL == '1'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vf-proxy-state"
          python - <<'PY'
          import json,os
          from pathlib import Path
          value=json.loads(os.environ['CODEX_PROXY_ACCOUNTS_JSON'])
          assert isinstance(value,dict) and isinstance(value.get('records'),list)
          assert value['records'] and all(isinstance(r,dict) and isinstance(r.get('token'),dict) for r in value['records'])
          p=Path(os.environ['RUNNER_TEMP'])/'vf-proxy-state'/'accounts.json'
          p.write_text(json.dumps(value),encoding='utf-8')
          p.chmod(0o600)
          PY
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          docker run -d --name vf-proxy-ep01-part \
            --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 \
            -e PROXY_API_KEY="$CODEX_PROXY_API_KEY" -e DATA_DIR=/app/data \
            -e DEBUG_LOG_PAYLOADS=false \
            -v "$RUNNER_TEMP/vf-proxy-state:/app/data:rw" \
            ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1 >/dev/null
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Proxy nao respondeu /health/live"
          exit 1
      - name: Editar o mesmo PNG fonte por proxy sem gerar pose nova
        if: steps.request.outputs.execute == 'true'
        shell: bash
        env:
          PART: ${{ steps.request.outputs.part }}
        run: |
          set -euo pipefail
          python -m videoforge.proxy_images health --url "$PROXY_ENDPOINT"
          python -m videoforge.ep01_shot_layers --part "$PART" --url "$PROXY_ENDPOINT"
      - name: Arquivar PNG original da camada e QA por canal com SHA
        if: always() && steps.request.outputs.execute == 'true'
        shell: bash
        run: |
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-shot-layer-v2 "${{ job.status }}"
      - name: Guardar output tecnico de cada camada
        if: always() && steps.request.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vf-ep01-layer-${{ inputs.part }}-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens/
          retention-days: 14
          if-no-files-found: warn
      - name: Limpar credenciais efemeras
        if: always()
        shell: bash
        run: |
          docker rm -f vf-proxy-ep01-part >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vf-proxy-state"
