name: "VideoForge - QA da referencia visual aprovada do dorama"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'videoforge/dorama_continuity.py'
      - 'videoforge/production_art.py'
      - 'tests/test_dorama_continuity.py'
      - '.github/workflows/qa-dorama-continuity.yml'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/CONTINUIDADE-VISUAL-APROVADA-C01-P04.json'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/production-art.json'
permissions:
  contents: read
jobs:
  verify-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar SHA do original, URL de image edit, elenco e nao publicacao
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_dorama_continuity tests.test_production_art tests.test_first_dorama_image -v
      - name: Confirmar exclusao de imagens rejeitadas e ausencia de upload
        shell: bash
        run: |
          python - <<'PY'
          from videoforge.dorama_continuity import reference
          item,raw=reference()
          assert item['limitations']['old_rejected_reference_is_not_resurrected']
          assert item['limitations']['youtube_upload'] is False
          assert raw.startswith(bytes((137,80,78,71)))
          print('CONTINUITY_APPROVED_ANCHOR_SHA', item['sha256'])
          print('PROVIDER_CALLS=0; YOUTUBE_UPLOAD=FALSE')
          PY
