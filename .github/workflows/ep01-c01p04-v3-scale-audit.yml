name: "VideoForge - EP01 C01-P04 V3 auditar escala de personagens"
run-name: "EP01 C01-P04 V3 / auditoria de escala sem IA"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-AUDITORIA-ESCALA-C01-P04-V3.json'

permissions:
  contents: write

concurrency:
  group: ep01-c01p04-v3-scale-audit-main
  cancel-in-progress: false

jobs:
  inspect-actors:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "Pillow==11.3.0"
      - name: Conferir alfa original e ROIs estimadas sem gerar novas imagens
        run: |
          set -euo pipefail
          python scripts/qa_ep01_c01p04_v3_scale_audit.py
      - name: Persistir evidencias e bloquear rig ate revisao visual
        shell: bash
        run: |
          set -euo pipefail
          ep=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$ep/QA-C01-P04-V3-ESCALA-PERSONAGENS.jpg" "$ep/QA-C01-P04-V3-ESCALA-PERSONAGENS.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(ep01): evidencias de escala dos 4 personagens sem rig'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep01-c01p04-v3-actor-scale-review
          path: canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-C01-P04-V3-ESCALA-PERSONAGENS*
          retention-days: 30
          if-no-files-found: warn
