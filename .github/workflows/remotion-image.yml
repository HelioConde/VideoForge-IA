name: Preparar imagem Remotion Three reutilizavel
on:
  push:
    branches: [main]
    paths:
      - 'infra/containers/Dockerfile.remotion'
      - 'motion-remotion/package.json'
      - 'motion-remotion/package-lock.json'
      - '.github/workflows/remotion-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: videoforge-remotion-image
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Instalar Remotion/Node/Chrome uma unica vez e publicar no GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/Dockerfile.remotion
          push: true
          tags: ghcr.io/helioconde/videoforge-remotion-runner:rig-three-remotion4-v1
          cache-from: type=gha,scope=videoforge-remotion
          cache-to: type=gha,mode=max,scope=videoforge-remotion
      - name: Validar Node/Remotion/Chrome/FFmpeg na imagem publicada
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/helioconde/videoforge-remotion-runner:rig-three-remotion4-v1
          docker pull "$image"
          docker run --rm "$image" sh -ec '
            node --version
            python --version
            ffprobe -version | head -n 1
            cd /opt/videoforge-remotion
            node -p "require(\"remotion/package.json\").version"
            node -p "require(\"@remotion/cli/package.json\").version"
            test -d node_modules/.remotion/chrome-headless-shell
            ./node_modules/.bin/remotion browser ensure --log error
          '
