name: "VideoForge - EP01 alinhar PNG independente (sem IA)"
on:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-ALINHAMENTO-PROXY-EP01.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ep01-align-independent-png-${{ github.ref }}
  cancel-in-progress: false

jobs:
  align-proxy-png:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow fixado para verificar o pixel a pixel
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Validar origem, dimensoes e SHA sem chamadas IA
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from videoforge import ep01_align_proxy_part as tool
          file=Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-ALINHAMENTO-PROXY-EP01.json')
          req=json.loads(file.read_text(encoding='utf-8'))
          if (req.get('schema')!='videoforge/ep01-proxy-part-alignment-request/v1'
              or req.get('shot_id')!='C01-P03' or req.get('part')!='background-clean'
              or req.get('no_provider_calls') is not True
              or req.get('allow_crop_or_resize') is not False
              or req.get('max_bottom_rows_to_add')!=2
              or req.get('youtube_upload') is not False):
              raise SystemExit('EP01_ALIGNMENT_REQUEST_NOT_APPROVED_SCOPE')
          registry=json.loads(Path('canal/alchemy-lab/biblia-visual/REGISTRO-GERACOES.json').read_text())
          already=any(row.get('asset')=='c01-p03-background-clean-native-aligned-v1'
              and '/production-proxy-separate-alignment-v1/' in row.get('arquivo','')
              for row in registry['geracoes'])
          if not already:
              pre=tool.prepare(req['shot_id'],req['part'])
              if pre['source']['sha256']!=req['source_sha256']:
                  raise SystemExit('EP01_ALIGNMENT_INPUT_SHA_MISMATCH')
              print('EP01_ALIGN_PREFLIGHT_VERIFIED',pre['padding'],'bottom_rows; paid_calls=0')
          else:
              print('EP01_ALIGN_ALREADY_ARCHIVED_STOP_WITHOUT_DUPLICATE')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('execute='+('false' if already else 'true')+'\n')
          PY
      - name: Preencher apenas a borda inferior mantendo todos pixels da IA intactos
        if: steps.inspect.outputs.execute == 'true'
        run: |
          python -m videoforge.ep01_align_proxy_part --shot-id C01-P03 --part background-clean
      - name: Salvar PNG alinhado versionado e proveniencia
        if: always() && steps.inspect.outputs.execute == 'true'
        shell: bash
        run: |
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-proxy-separate-alignment-v1 "${{ job.status }}"
      - name: Backup do novo PNG para auditoria
        if: always() && steps.inspect.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vf-ep01-proxy-part-native-aligned-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens/
          retention-days: 14
          if-no-files-found: warn
