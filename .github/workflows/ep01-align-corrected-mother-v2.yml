name: "VideoForge - alinhar C01-P04 mãe V2 em 1 pixel (sem IA)"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-ALINHAR-MAE-V2.json'

permissions:
  contents: write
jobs:
  align-corrected-mother:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencia de PNG local, sem modelo de IA
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Conferir pedido, SHA e sem cortar a imagem
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from videoforge.ep01_align_corrected_mother_v2 import prepare,SOURCE_SHA,ASSET,PRODUCER
          req=json.loads(Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-ALINHAR-MAE-V2.json').read_text())
          if (req.get('schema')!='videoforge/ep01-mother-v2-alignment-request/v1' or
              req.get('shot_id')!='C01-P04' or
              req.get('source_sha256')!=SOURCE_SHA or
              req.get('no_proxy_calls') is not True or
              req.get('allow_crop_or_resize') is not False or
              req.get('youtube_upload') is not False):
              raise SystemExit('EP01_V2_ALIGNMENT_REQUEST_INVALID')
          reg=json.loads(Path('canal/alchemy-lab/biblia-visual/REGISTRO-GERACOES.json').read_text())
          exists=any(x.get('asset')==ASSET and f'/{PRODUCER}/' in x.get('arquivo','') for x in reg['geracoes'])
          if not exists: prepare()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('execute='+('false' if exists else 'true')+'\n')
          print('EP01_MOTHER_V2_ALIGNMENT_PREFLIGHT',not exists,'paid_calls=0')
          PY
      - name: Completar uma linha inferior sem alterar pixels ou gerar imagem
        if: steps.check.outputs.execute == 'true'
        run: python -m videoforge.ep01_align_corrected_mother_v2
      - name: Arquivar arte candidata alinhada e hash
        if: always() && steps.check.outputs.execute == 'true'
        shell: bash
        run: |
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-scene-mother-v2-aligned "${{ job.status }}"
      - name: Preservar arte original alinhada
        if: always() && steps.check.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ep01-c01p04-mother-v2-native-aligned-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens/
          retention-days: 14
          if-no-files-found: warn
