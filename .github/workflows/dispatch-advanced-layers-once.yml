name: Teste unico - solicitar foreground e capa
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dispatch-advanced-layers-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  start:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Enviar Teste 2 pelo workflow principal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/scene-layers-advanced.yml/dispatches" \
            --field ref=main \
            --raw-field 'inputs[source_run_id]=43437394037' \
            --field 'inputs[channel]=otaku-br' \
            --field 'inputs[video_id]=teste-proxy-20261113' \
            --field 'inputs[scene]=cena-01' \
            --field 'inputs[component]=pair' \
            --field 'inputs[mode]=ephemeral' \
            --field 'inputs[model]=gpt-image-2'
          echo 'Teste de foreground e capa solicitado.'
