name: "VideoForge - EP01 Aldric V3 RGBA reparo V2"
run-name: "EP01 C01-P04 V3 / reparar Aldric 1200x1310"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-CORRECAO-ALDRIC-V2.json'

permissions:
  contents: write
  packages: read

concurrency:
  group: ep01-approved-v3-aldric-repair-v2-main
  cancel-in-progress: false

jobs:
  repair-independent-aldric:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      CODEX_PROXY_BASE_URL: ${{ secrets.CODEX_PROXY_BASE_URL }}
      CODEX_PROXY_ACCOUNTS_JSON: ${{ secrets.CODEX_PROXY_ACCOUNTS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar biblioteca para conferir canvas e transparencia
        run: python -m pip install --quiet "Pillow==11.3.0"
      - name: Preflight SHA de aprovada e da rejeitada, 0 chamadas IA
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ep01_approved_v3_aldric_repair -v
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from videoforge import ep01_approved_v3_aldric_repair as r
          req=Path("canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-CORRECAO-ALDRIC-V2.json")
          data=json.loads(req.read_text(encoding="utf-8"))
          if (data.get("schema")!="videoforge/ep01-aldric-independent-v3-repair-request/v2"
              or data.get("channel")!="alchemy-lab"
              or data.get("video_id")!="mmorpg-conquiste-a-princesa-ep01"
              or data.get("shot_id")!="C01-P04"
              or data.get("part")!="character-aldric"
              or data.get("rejected_source_sha256")!=r.REJECTED_SHA
              or data.get("retry_on_failure") is not False
              or data.get("one_image_per_run") is not True
              or data.get("allow_crop_or_resize") is not False
              or data.get("rig_ready") is not False
              or data.get("youtube_upload") is not False):
              raise SystemExit("EP01_ALDRIC_REPAIR_REQUEST_INVALID")
          if os.environ["GITHUB_EVENT_NAME"]=="push":
              changed=subprocess.check_output(["git","diff-tree","--no-commit-id",
                  "--name-only","-r",os.environ["GITHUB_SHA"]],text=True).splitlines()
              if str(req) not in changed:
                  raise SystemExit("EP01_ALDRIC_REPAIR_REQUEST_NOT_CHANGED")
          existing=r.archived()
          if not existing:
              spec=r.prepare()
              print("EP01_ALDRIC_REPAIR_PREFLIGHT",len(spec["images"]),"references","cost=1")
          else:
              print("EP01_ALDRIC_REPAIR_ARCHIVED_NO_DUPLICATE",existing["sha256"])
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("execute="+("false" if existing else "true")+"\n")
          PY
      - name: Verificar conexao proxy sem expor credenciais
        if: steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CODEX_PROXY_API_KEY" ]]; then
            echo "::error::Falta CODEX_PROXY_API_KEY"; exit 1
          fi
          if [[ -n "$CODEX_PROXY_BASE_URL" ]]; then
            printf 'PROXY_ENDPOINT=%s\n' "$CODEX_PROXY_BASE_URL" >> "$GITHUB_ENV"
          elif [[ -n "$CODEX_PROXY_ACCOUNTS_JSON" ]]; then
            echo 'PROXY_ENDPOINT=http://127.0.0.1:18080' >> "$GITHUB_ENV"
            echo 'USE_EPHEMERAL=1' >> "$GITHUB_ENV"
          else
            echo "::error::Proxy sem BASE_URL nem contas"; exit 1
          fi
      - name: Ligar proxy efemero precompilado quando necessario
        if: steps.preflight.outputs.execute == 'true' && env.USE_EPHEMERAL == '1'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vf-proxy-state"
          python - <<'PY'
          import json,os
          from pathlib import Path
          value=json.loads(os.environ["CODEX_PROXY_ACCOUNTS_JSON"])
          assert isinstance(value,dict) and isinstance(value.get("records"),list)
          assert value["records"] and all(isinstance(r,dict) and isinstance(r.get("token"),dict) for r in value["records"])
          p=Path(os.environ["RUNNER_TEMP"])/"vf-proxy-state"/"accounts.json"
          p.write_text(json.dumps(value),encoding="utf-8")
          p.chmod(0o600)
          PY
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          docker run -d --name vf-proxy-c01p04-aldric-v2 \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 \
            -e PROXY_API_KEY="$CODEX_PROXY_API_KEY" -e DATA_DIR=/app/data \
            -e DEBUG_LOG_PAYLOADS=false \
            -v "$RUNNER_TEMP/vf-proxy-state:/app/data:rw" \
            ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1 >/dev/null
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Proxy nao respondeu /health/live"; exit 1
      - name: Gerar Aldric independente em quadro completo por IA
        if: steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.proxy_images health --url "$PROXY_ENDPOINT"
          python -m videoforge.ep01_approved_v3_aldric_repair
      - name: Arquivar PNG, inclusive se rejeitado pelo QA tecnico
        if: always() && steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-c01p04-v3-independent-parts-repair-v2 "${{ job.status }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.preflight.outputs.execute == 'true'
        with:
          name: ep01-aldric-independent-repair-v2-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens/
          if-no-files-found: warn
          retention-days: 30
      - name: Limpar estado temporario
        if: always()
        shell: bash
        run: |
          docker rm -f vf-proxy-c01p04-aldric-v2 >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vf-proxy-state"
