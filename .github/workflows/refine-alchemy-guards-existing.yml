name: "VideoForge - refinar guardas sem imagens novas"
on:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-refinar-guardas.json'

permissions:
  contents: write

concurrency:
  group: vf-alchemy-existing-guard-refinement
  cancel-in-progress: false

jobs:
  corrigir-recortes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Proibir qualquer gerador de imagens e verificar pedido
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          base=pathlib.Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01')
          request=json.loads((base/'pedido-refinar-guardas.json').read_text(encoding='utf8'))
          assert request['schema']=='videoforge/guard-refinement-request/v1'
          assert request['channel']=='alchemy-lab'
          assert request['video_id']=='mmorpg-conquiste-a-princesa-ep01'
          assert request['image_generation_calls']==0
          assert request['only_existing_pixels'] is True
          assert request['human_visual_approval'] is False
          assert request['youtube_upload'] is False
          assert (base/'SEM-GERACAO-NOVAS-IMAGENS.lock').is_file()
          print('SOURCE_ONLY: no AI, no render, no publication')
          PY
      - name: Preparar extrator local de pixels (bibliotecas gratuitas)
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Isolar contornos a partir da mãe original e alfa previamente existente
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.refine_existing_guards
      - name: Salvar os 4 recortes e o QA no canal, sem substituição de artes
        shell: bash
        run: |
          set -euo pipefail
          DEST='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/cena-01/rig-drafts/guardas-refinados'
          git config user.name 'videoforge-archive[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$DEST"
          if git diff --cached --quiet; then
            echo "Recortes já presentes, nenhum commit necessário"
            exit 0
          fi
          git commit -m 'assets(alchemy): refinar silhuetas dos guardas a partir de pixels da mãe'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Registrar limitações de QA
        run: echo 'Candidatos derivados de pixels existentes. Falta reconstruir áreas encobertas e rig real.'
