name: "VideoForge - QA visual de mães V2 (sem IA)"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-ep01-corrected-mothers-v2.yml'
      - 'scripts/qa-ep01-corrected-mothers-v2.py'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-QA-MAES-V2.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ep01-c01p03p04-versioned-mothers-visual-qa
  cancel-in-progress: false

jobs:
  compare-versioned-mothers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow para QA de PNGs de origem SHA arquivados
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Validar V1 e V2 e gerar comparação sem imagem nova
        run: PYTHONPATH=. python scripts/qa-ep01-corrected-mothers-v2.py
      - name: Registrar JPG e JSON sem mudança de aprovação
        shell: bash
        run: |
          set -euo pipefail
          EP="canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01"
          git add "$EP/QA-MAES-C01-P03-P04-V2.jpg" "$EP/QA-MAES-C01-P03-P04-V2.json"
          if git diff --cached --quiet; then
            echo "EP01_CORRECTED_MOTHERS_QA_ALREADY_ARCHIVED"
            exit 0
          fi
          git config user.name "videoforge-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "qa(ep01): comparação V1/V2 mães corrigidas para revisão visual"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
          done
          exit 1
      - name: Salvar comparação SHA verificada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-c01p03p04-mothers-v2-qa-${{ github.run_id }}
          path: |
            canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-MAES-C01-P03-P04-V2.jpg
            canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-MAES-C01-P03-P04-V2.json
          retention-days: 14
          if-no-files-found: warn
