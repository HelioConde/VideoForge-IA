name: "VideoForge - avaliar regioes semanticas validadas sem publicar"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'videoforge/wardrobe_roi_color.py'
      - 'tests/test_wardrobe_roi_color.py'
      - '.github/workflows/qa-wardrobe-roi-color.yml'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/CONTRATO-ROI-SEMANTICAS-V2.json'
permissions:
  contents: write
concurrency:
  group: vf-wardrobe-roi-color
  cancel-in-progress: false
jobs:
  analyze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow offline para medições em polígonos verificados
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Testar reprovação automática de troca vermelho-preto e recusa sem máscara
        run: python -m unittest tests.test_wardrobe_roi_color -v
      - name: Avaliar ROIs sem promover a arte
        run: python -m videoforge.wardrobe_roi_color --sync
      - name: Arquivar QA e relatório de pendências
        shell: bash
        run: |
          set -euo pipefail
          EP=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'videoforge-roi-qa[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EP/QA-COMPARACAO-ROI-SEMANTICA-V2.json" "$EP/RELATORIO-ROI-SEMANTICA-V2.md"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(dorama): registrar avaliacao das ROIs reais sem aprovar figurinos'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
