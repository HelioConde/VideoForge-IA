name: "VideoForge - Gerar cena-mae real por canal e referencia"
on:
  workflow_dispatch:
    inputs:
      channel:
        required: true
        type: choice
        options: [otaku-br, otaku-en, gamer, manu-kids, alchemy-lab]
        default: alchemy-lab
      video_id:
        required: true
        type: string
        default: mmorpg-conquiste-a-princesa-ep01
      number:
        required: true
        type: number
        default: 1
      reference_run_id:
        required: true
        type: string
        default: '43590930215'
  push:
    branches: [main]
    paths:
      - 'canal/*/videos/*/pedido-geracao-cena.json'

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  gerar-cena:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      CODEX_PROXY_BASE_URL: ${{ secrets.CODEX_PROXY_BASE_URL }}
      CODEX_PROXY_ACCOUNTS_JSON: ${{ secrets.CODEX_PROXY_ACCOUNTS_JSON }}
      INPUT_CHANNEL: ${{ inputs.channel }}
      INPUT_VIDEO_ID: ${{ inputs.video_id }}
      INPUT_NUMBER: ${{ inputs.number }}
      INPUT_REFERENCE_RUN_ID: ${{ inputs.reference_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir pedido, referencia do mesmo canal e limite de uma imagem
        shell: bash
        id: request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,re,subprocess
          if os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch":
              ch,vid=os.environ["INPUT_CHANNEL"],os.environ["INPUT_VIDEO_ID"]
              number=int(os.environ["INPUT_NUMBER"])
              run_id=int(os.environ["INPUT_REFERENCE_RUN_ID"])
          else:
              names=subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r","HEAD"],text=True).splitlines()
              names=[n for n in names if re.fullmatch(r"canal/[a-z0-9-]+/videos/[a-z0-9-]+/pedido-geracao-cena\.json",n)]
              if len(names)!=1:
                  raise SystemExit("SCENE_REQUEST_AMBIGUOUS")
              path=pathlib.Path(names[0])
              req=json.loads(path.read_text(encoding="utf-8"))
              ch,vid=path.parts[1],path.parts[3]
              if req.get("schema")!="videoforge/scene-generation-request/v1" or req.get("channel")!=ch or req.get("video_id")!=vid or req.get("youtube_upload") is not False or req.get("max_calls_per_run")!=1:
                  raise SystemExit("SCENE_REQUEST_INVALID")
              number=req.get("scene_number")
              run_id=req.get("reference_run_id")
          from videoforge.paths import CHANNEL_IDS,IDENTIFIER
          from videoforge.production_scenes import scene_prompt
          if ch not in CHANNEL_IDS or not IDENTIFIER.fullmatch(vid) or type(number) is not int or type(run_id) is not int or run_id<=0:
              raise SystemExit("SCENE_REQUEST_IDENTIFIERS_INVALID")
          prompt,scene=scene_prompt(ch,vid,number)
          if len(prompt)>5000:
              raise SystemExit("SCENE_PROMPT_TOO_LONG")
          name=f"vf-real-art-{ch}-{vid}-character-bible-{run_id}"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"channel={ch}\nvideo_id={vid}\nnumber={number}\nreference_run_id={run_id}\nreference_artifact={name}\n")
          print("SCENE_REQUEST_VALIDATED",ch,vid,number,"reference_run",run_id,"1 edit call")
          PY
      - name: Verificar proxy sem expor credenciais
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CODEX_PROXY_API_KEY" ]]; then
            echo "::error::CODEX_PROXY_API_KEY ausente"; exit 1
          fi
          if [[ -n "$CODEX_PROXY_BASE_URL" ]]; then
            printf 'PROXY_ENDPOINT=%s\n' "$CODEX_PROXY_BASE_URL" >> "$GITHUB_ENV"
          elif [[ -n "$CODEX_PROXY_ACCOUNTS_JSON" ]]; then
            echo 'PROXY_ENDPOINT=http://127.0.0.1:18080' >> "$GITHUB_ENV"
            echo 'USE_EPHEMERAL=1' >> "$GITHUB_ENV"
          else
            echo "::error::Proxy nao configurado"; exit 1
          fi
      - name: Iniciar proxy local precompilado se preciso
        if: env.USE_EPHEMERAL == '1'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vf-proxy-state"
          python - <<'PY'
          import json,os
          from pathlib import Path
          value=json.loads(os.environ['CODEX_PROXY_ACCOUNTS_JSON'])
          assert isinstance(value,dict) and isinstance(value.get("records"),list)
          assert value["records"] and all(isinstance(x,dict) and isinstance(x.get("token"),dict) for x in value["records"])
          p=Path(os.environ["RUNNER_TEMP"])/"vf-proxy-state"/"accounts.json"
          p.write_text(json.dumps(value),encoding="utf-8")
          p.chmod(0o600)
          PY
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          docker run -d --name vf-proxy-scene-request --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 \
            -e PROXY_API_KEY="$CODEX_PROXY_API_KEY" -e DATA_DIR=/app/data -e DEBUG_LOG_PAYLOADS=false \
            -v "$RUNNER_TEMP/vf-proxy-state:/app/data:rw" \
            ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1 >/dev/null
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Proxy indisponivel"; exit 1
      - name: Baixar referencia visual real da mesma obra
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.request.outputs.reference_run_id }}
          name: ${{ steps.request.outputs.reference_artifact }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./input
      - name: Produzir cena-mae pelo gerador existente com referencia (uma chamada)
        shell: bash
        env:
          CHANNEL: ${{ steps.request.outputs.channel }}
          VIDEO_ID: ${{ steps.request.outputs.video_id }}
          SCENE_NUMBER: ${{ steps.request.outputs.number }}
        run: |
          set -euo pipefail
          python -m unittest tests.test_production_art tests.test_production_scenes -v
          python -m videoforge.proxy_images health --url "$PROXY_ENDPOINT"
          CH_SCOPE="${CHANNEL:-${CH:-}}"
          VID_SCOPE="${VIDEO_ID:-${VID:-}}"
          if [[ "$CH_SCOPE" == "alchemy-lab" && "$VID_SCOPE" == "mmorpg-conquiste-a-princesa-ep01" && -f "canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/SEM-GERACAO-NOVAS-IMAGENS.lock" ]]; then
            echo "::error::Geracao de imagens bloqueada neste episodio por instrução do usuario; usar apenas PNGs existentes"
            exit 2
          fi
          python -m videoforge.production_scenes --channel "$CHANNEL" --video-id "$VIDEO_ID" \
            --number "$SCENE_NUMBER" --reference ./input/character-bible.png \
            --reference-report ./input/character-bible.production.json \
            --model gpt-image-2 --url "$PROXY_ENDPOINT"
      - name: Guardar PNG de cena e origem para QA visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vf-real-scene-${{ steps.request.outputs.channel }}-${{ steps.request.outputs.video_id }}-${{ steps.request.outputs.number }}-${{ github.run_id }}
          path: output/${{ steps.request.outputs.channel }}/videos/${{ steps.request.outputs.video_id }}/imagens/
          retention-days: 14
          if-no-files-found: warn
      - name: Limpar proxy temporario
        if: always()
        shell: bash
        run: |
          docker rm -f vf-proxy-scene-request >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vf-proxy-state"
