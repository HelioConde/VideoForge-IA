name: "Agents - publicar checkpoints tecnicos (manual)"
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PUBLISH_TECHNICAL_CHECKPOINTS para habilitar comentarios"
        required: true
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: agent-checkpoint-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'HelioConde/VideoForge-IA' && inputs.confirm == 'PUBLISH_TECHNICAL_CHECKPOINTS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read Issue snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const all=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'all',per_page:100});
            fs.writeFileSync('/tmp/agent-issues-snapshot.json',JSON.stringify(all.filter(x=>!x.pull_request).map(x=>({
              number:x.number,state:x.state,body:x.body||'',pull_request:false
            }))));
      - name: Execute bounded read-only audits and prepare comments
        run: |
          python -m unittest discover -s tests -p 'test_issue_dispatch_preview.py' -v
          python -m unittest discover -s tests -p 'test_issue_checkpoints.py' -v
          python orchestrator/issue_dispatch_preview.py --queue orchestrator/tasks.json --snapshot /tmp/agent-issues-snapshot.json --output /tmp/agent-issue-dispatch.json --limit 2
          python orchestrator/issue_checkpoints.py --dispatch /tmp/agent-issue-dispatch.json --snapshot /tmp/agent-issues-snapshot.json --output /tmp/agent-checkpoint-proposals.json
      - name: Publish deduplicated technical checkpoints
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const report=JSON.parse(fs.readFileSync('/tmp/agent-checkpoint-proposals.json','utf8'));
            if(report.mode!=='checkpoint_proposals_only'||report.human_approval!==false||
               report.proxy_calls!==0||report.youtube_publications!==0||report.comments.length>2){
              core.setFailed('Checkpoint safety gate failed');return;
            }
            for(const c of report.comments){
              const {data:issue}=await github.rest.issues.get({...context.repo,issue_number:c.issue_number});
              if(issue.state!=='open'||!issue.body?.includes('<!-- videoforge-task:'+c.task_id+' -->')){
                core.setFailed('Issue changed during run: '+c.task_id);return;
              }
              const comments=await github.paginate(github.rest.issues.listComments,{
                ...context.repo,issue_number:c.issue_number,per_page:100
              });
              if(comments.some(x=>x.body?.includes('<!-- '+c.marker+' -->'))){
                core.info('Already recorded '+c.task_id);continue;
              }
              await github.rest.issues.createComment({...context.repo,issue_number:c.issue_number,body:c.body});
              core.info('Published technical checkpoint for '+c.task_id);
            }
      - name: Archive checkpoint proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-technical-checkpoints-${{ github.run_id }}
          path: |
            /tmp/agent-issue-dispatch.json
            /tmp/agent-checkpoint-proposals.json
          if-no-files-found: ignore
          retention-days: 14
