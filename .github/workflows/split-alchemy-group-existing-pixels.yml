name: "VideoForge - separar guardas do grupo existente sem IA"
on:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-dividir-grupo.json'

permissions:
  contents: write

concurrency:
  group: vf-alchemy-split-existing-group
  cancel-in-progress: false

jobs:
  separar:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Garantir divisao de pixels existentes somente
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-dividir-grupo.json")
          r=json.loads(p.read_text(encoding="utf8"))
          assert r.get("schema")=="videoforge/split-existing-asset-request/v1"
          assert r.get("channel")=="alchemy-lab"
          assert r.get("image_generation_calls")==0
          assert r.get("source_only") is True
          assert r.get("human_visual_approval") is False
          assert r.get("youtube_upload") is False
          PY
      - name: Instalar Pillow para recortar pixels, sem modelo de imagem
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Particionar o recorte conjunto na mesma geometria, sem desenhar
        shell: bash
        run: |
          set -euo pipefail
          BASE='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01'
          python -m videoforge.split_existing_png_parts \
            --source "$BASE/assets/cena-01/candidatos/character-group-REJECTED.png" \
            --plan "$BASE/rig-group-partition.json" \
            --dest "$BASE/assets/cena-01/rig-drafts/grupo"
      - name: Salvar PNGs em canal/alchemy-lab mantendo reprovações
        shell: bash
        run: |
          set -euo pipefail
          DEST='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/cena-01/rig-drafts/grupo'
          git config user.name 'videoforge-archive[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$DEST"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets(alchemy): separar guardas de grupo antigo sem imagem nova; QA bloqueado'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Nao aprovar
        run: echo 'Guarda e rei permanecem CANDIDATOS, com halo e trono contaminante.'
