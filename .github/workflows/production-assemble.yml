name: "VideoForge - Montar MP4 com artes reais no programa principal"
on:
  workflow_run:
    workflows:
      - "VideoForge - Produzir cenas restantes da obra com arte real"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/requests/reprocessar-mp4-spy-family.json'
  workflow_dispatch:
    inputs:
      batch_run_id:
        description: "Run com as imagens restantes verificadas"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: vf-otaku-br-spy-family-real-assembly
  cancel-in-progress: false

jobs:
  montar-preview-revisao:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/helioconde/videoforge-media-runner:ubuntu2404-ffmpeg-espeak-v3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Baixar referencia visual original e checksum
        uses: actions/download-artifact@v4
        with:
          run-id: 43555226353
          name: vf-otaku-br-spy-family-arte-real-43555226353
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./input/reference
      - name: Baixar primeira cena real e comprovante
        uses: actions/download-artifact@v4
        with:
          run-id: 43555469650
          name: vf-otaku-br-spy-scene-01-43555469650
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./input/scenes
      - name: Baixar TODAS as outras cenas geradas neste lote
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.batch_run_id || '43555715519' }}
          pattern: vf-otaku-br-spy-scene-*
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./input/scenes
      - name: Baixar narracoes PT-BR geradas no mesmo projeto
        uses: actions/download-artifact@v4
        with:
          run-id: 43545398967
          name: spy-family-voice-stage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./input/voice
      - name: Verificar origem, sprites de cena e manifestos antes do render
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_production_art tests.test_production_scenes tests.test_production_assemble -v
          test -s ./input/reference/character-bible.production.json
          python - <<'PY'
          import json
          from pathlib import Path
          story=json.loads(Path("canal/otaku-br/videos/spy-x-family-familia-de-mentira/roteiro.json").read_text())
          scenes=story["scenes"]
          for i,scene in enumerate(scenes,1):
              assert (Path("input/scenes")/f"cena-{i:02d}.png").is_file(),f"Cena {i} nao gerada pelo proxy"
              assert (Path("input/scenes")/f"cena-{i:02d}.production.json").is_file(),f"Proveniencia da cena {i} ausente"
          print(f"ARTES_REAIS_PRESENTES: {len(scenes)} cenas")
          PY
      - name: Produzir MP4 pelo videoforge.mvp.render com assets reais
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.production_assemble \
            --channel otaku-br --video-id spy-x-family-familia-de-mentira \
            --images ./input/scenes \
            --voice ./input/voice \
            --reference-report ./input/reference/character-bible.production.json
      - name: Entregar MP4 original do programa para QA visual (NAO oficial)
        uses: actions/upload-artifact@v4
        with:
          name: vf-otaku-br-spy-family-artes-reais-mp4-${{ github.run_id }}
          path: |
            output/otaku-br/videos/spy-x-family-familia-de-mentira/video.mp4
            output/otaku-br/videos/spy-x-family-familia-de-mentira/video.qa.json
            output/otaku-br/videos/spy-x-family-familia-de-mentira/real-art.review.qa.json
          retention-days: 14
          if-no-files-found: error
