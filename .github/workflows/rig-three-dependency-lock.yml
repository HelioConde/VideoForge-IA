name: "VideoForge - Preparar lockfile Three.js (bootstrap unico)"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/requests/bootstrap-rig-three.json'
permissions:
  contents: write
concurrency:
  group: vf-bootstrap-three-deps
  cancel-in-progress: false
jobs:
  prepare-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Gerar somente UMA vez o lockfile reproduzivel de Three para o GHCR
        shell: bash
        run: |
          set -euo pipefail
          cd motion-remotion
          npm install --package-lock-only --save-exact --no-audit --no-fund \
            three @react-three/fiber @remotion/three@4.0.539
          npm install --package-lock-only --save-dev --save-exact --no-audit --no-fund \
            @types/three
          npm ci --no-audit --no-fund
          node -e 'const a=require("./package-lock.json").packages;
            if(a["node_modules/remotion"].version!=="4.0.539" ||
              a["node_modules/@remotion/three"].version!=="4.0.539" ||
              !a["node_modules/three"] || !a["node_modules/@react-three/fiber"])
              process.exit(1);
            console.log("THREE_LOCKFILE_MATCHES_REMOTION_4_0_539");'
          ./node_modules/.bin/tsc --noEmit
      - name: Versionar lockfile verificado na main (commit auditavel)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "videoforge-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-remotion/package.json motion-remotion/package-lock.json
          if git diff --cached --quiet; then
            echo "RIG_THREE_LOCK_ALREADY_COMMITTED"
            exit 0
          fi
          git commit -m "build(remotion): lock Three.js, R3F e @remotion/three em versoes reproduziveis"
          git push origin HEAD:main
      - name: Entregar package.json e package-lock.json para commit auditavel
        uses: actions/upload-artifact@v4
        with:
          name: vf-rig-three-locked-packages-${{ github.run_id }}
          path: |
            motion-remotion/package.json
            motion-remotion/package-lock.json
          retention-days: 7
          if-no-files-found: error
