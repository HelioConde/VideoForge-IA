name: "VideoForge - Alinhar background C01-P02 sem IA"
run-name: "EP01 / corrigir 2 pixels sem regenerar"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-ep01-align-background.yml'
permissions:
  contents: write
jobs:
  align-exact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar processamento de borda sem API de imagem
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Verificar SHA dos dois PNGs e preencher 2 linhas sem resize
        run: python -m videoforge.ep01_layer_alignment
      - name: Arquivar original alinhado, SHA e histórico sem chamadas pagas
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-shot-alignment-v2 "${{ job.status }}"
