name: VideoForge - Teste 1 background e personagem
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'ID da execucao de imagem original (artifact ativo)'
        required: true
        type: string
        default: '43433023378'
      channel:
        type: choice
        description: 'Canal da cena'
        options: [otaku-br, otaku-en, gamer, manu-kids, alchemy-lab]
        default: otaku-br
      video_id:
        type: string
        required: true
        default: teste-proxy-20261113
      scene:
        type: string
        required: true
        default: cena-01
      mode:
        type: choice
        options: [ephemeral, persistent]
        default: ephemeral
      model:
        type: choice
        options: [gpt-image-2, gpt-image-1.5]
        default: gpt-image-2

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  separar:
    uses: ./.github/workflows/scene-layer-engine.yml
    with:
      stage: basic
      source_run_id: ${{ inputs.source_run_id }}
      channel: ${{ inputs.channel }}
      video_id: ${{ inputs.video_id }}
      scene: ${{ inputs.scene }}
      mode: ${{ inputs.mode }}
      model: ${{ inputs.model }}
      component: pair
    secrets: inherit
