name: "Agents - Issue inbox read-only"
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  issues: read
concurrency:
  group: agent-issue-inbox-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inbox:
    if: github.repository == 'HelioConde/VideoForge-IA'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read all task Issues (no writes)
        uses: actions/github-script@v7
        env:
          OUT: /tmp/agent-issues-snapshot.json
        with:
          script: |
            const fs = require('fs');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', per_page: 100
            });
            const safe = issues.filter(i => !i.pull_request).map(i => ({
              number: i.number, state: i.state, html_url: i.html_url,
              body: i.body || '', pull_request: false
            }));
            fs.writeFileSync(process.env.OUT, JSON.stringify(safe, null, 2));
            core.info('Read ' + safe.length + ' issues');
      - name: Reconcile queue and Issue snapshot
        run: |
          python -m unittest discover -s tests -p 'test_issue_reconcile.py' -v
          python orchestrator/issue_reconcile.py --queue orchestrator/tasks.json --snapshot /tmp/agent-issues-snapshot.json --output /tmp/agent-issue-inbox.json --limit 10
      - name: Archive read-only inbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-issue-inbox-${{ github.run_id }}
          path: |
            /tmp/agent-issue-inbox.json
          if-no-files-found: ignore
          retention-days: 7
