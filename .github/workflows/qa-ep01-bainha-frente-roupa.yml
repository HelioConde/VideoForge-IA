name: "VideoForge - EP01 camada da bainha sobre a roupa"
run-name: "EP01 C01-P02 / corrigir profundidade bainha e luvas"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-ep01-bainha-frente-roupa.yml'
      - 'videoforge/ep01_layer_stack.py'
      - 'tests/test_ep01_layer_stack.py'
      - 'scripts/qa-ep01-bainha-frente-roupa.py'
permissions:
  contents: write
jobs:
  confirm-layer-depth:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow local sem geração de novas imagens IA
        run: python -m pip install --quiet --disable-pip-version-check Pillow==11.3.0
      - name: Validar ordem e sobreposição da bainha, luvas e espada
        run: python -m unittest tests.test_ep01_layer_stack -v
      - name: Comparar cena original, sobreposição antiga e nova com zoom
        run: PYTHONPATH=. python scripts/qa-ep01-bainha-frente-roupa.py
      - name: Publicar JPG e dados de QA no canal
        shell: bash
        run: |
          set -euo pipefail
          ep=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'videoforge-qa-bainha[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ep/QA-C01-P02-BAINHA-FRENTE-ROUPA.jpg" "$ep/QA-C01-P02-BAINHA-FRENTE-ROUPA.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(ep01): comparar bainha na frente da roupa e mãos na frente da arma'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
          done
          exit 1
