name: "VideoForge - Historico rejeitado de translações da bainha"
run-name: "EP01 / confirmar que variantes 3 e 4 não serão reutilizadas"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-ep01-scabbard-registration.yml'
permissions:
  contents: read
jobs:
  blocked-deprecated-offsets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Comprovar que 6 deslocamentos permanecem rejeitados
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01')
          old=json.loads((base/'QA-C01-P02-REGISTRO-BAINHA.json').read_text(encoding='utf-8'))
          assert old['revisao_do_responsavel']['imagens_com_falha_identificadas']==[3,4]
          assert old['revisao_do_responsavel']['estado']=='rejeitado'
          assert old['variantes_deslocadas_aceitas']==0
          assert old['alinhamento_por_deslocamento_autorizado'] is False
          assert old['permitido_em_rig'] is False
          print('EP01_SCABBARD_LEGACY_SIX_OFFSETS_REJECTED_NO_REGENERATION')
          PY
