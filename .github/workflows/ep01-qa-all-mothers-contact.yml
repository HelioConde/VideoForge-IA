name: "VideoForge - EP01 pranchas de revisao das maes"
on:
  workflow_run:
    workflows: ["VideoForge - EP01 completar imagens-mae pendentes"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ep01-contact-mothers-main
  cancel-in-progress: false

jobs:
  qa-pranchas:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar todas as maes realmente arquivadas (39/39)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/CHECKPOINT-IMAGENS-EP01-AUTO.json')
          inv=json.loads(p.read_text(encoding='utf-8'))
          assert inv['visual_shots_with_original_mother']==39 and inv['visual_shots_missing_original_mother']==0, 'Ainda faltam imagens-mae; impedir QA completa'
          assert inv['human_visual_approval'] is False
          print('EP01_ALL_MOTHERS_READY_FOR_HUMAN_QA',39)
          PY
      - name: Instalar biblioteca local de QA (sem proxy)
        run: python -m pip install "Pillow==11.2.1"
      - name: Montar duas pranchas de 39 PNGs com SHAs verificados
        env:
          PYTHONPATH: .
        run: python scripts/qa_ep01_all_mothers_contact.py
      - name: Arquivar pranchas e manifesto de QA no canal
        shell: bash
        run: |
          set -euo pipefail
          ep='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01'
          python - <<'PY'
          from pathlib import Path
          path=Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/ESTADO-ATUAL.md')
          original=path.read_text(encoding='utf-8')
          marker='## 17/11/2026 — Conclusão das 39 imagens-mãe e pranchas de conferência'
          if marker not in original:
              note=(marker+'\n\n'
                    '- **39/39 imagens-mãe originais SHA-arquivadas**; inventário oficial em CHECKPOINT-IMAGENS-EP01-AUTO.json.\n'
                    '- Pranchas para revisão: QA-EP01-MAES-CATALOGO-01.jpg e QA-EP01-MAES-CATALOGO-02.jpg e QA-EP01-MAES-CATALOGO-C01-ALTERNATIVAS.jpg; manifesto QA-EP01-MAES-CATALOGO.json.\n'
                    '- Estas pranchas são apenas miniaturas para conferência humana; não são fontes de rig. Revisar continuidade, anatomia, roupas, mãos, armas e objetos.\n'
                    '- **Nenhuma aprovação individual automática**, sem sprites/RGBA definitivos, rig, MP4 ou upload YouTube.\n\n')
              path.write_text(note+original,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ep/QA-EP01-MAES-CATALOGO-01.jpg" "$ep/QA-EP01-MAES-CATALOGO-02.jpg" "$ep/QA-EP01-MAES-CATALOGO-C01-ALTERNATIVAS.jpg" "$ep/QA-EP01-MAES-CATALOGO.json" "$ep/ESTADO-ATUAL.md"
          if git diff --cached --quiet; then
            echo 'EP01_CONTACT_QA_ALREADY_ARCHIVED'
            exit 0
          fi
          git commit -m 'qa(ep01): arquivar pranchas das 39 imagens-mae para revisao manual'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Anexar pranchas ao workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-maes-pranchas-revisao
          path: canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-EP01-MAES-CATALOGO*
          if-no-files-found: warn
          retention-days: 30
