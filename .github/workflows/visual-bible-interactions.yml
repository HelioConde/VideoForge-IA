name: "VideoForge - Biblia Visual poses antigas descontinuadas"
run-name: "EP01 / validar fluxo cena-mae e cameras (sem poses)"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-bible-interactions.yml'
permissions:
  contents: read
jobs:
  check-only-no-pose-generation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirmar plano de 40 tomadas sem poses obrigatorias
        run: |
          set -euo pipefail
          python -m videoforge.layered_shot_plan
          python -m unittest tests.test_layered_shot_plan -v
          echo 'LEGACY_POSE_WORKFLOW_DISABLED_NO_PROVIDER_CALLS_NO_YOUTUBE'
