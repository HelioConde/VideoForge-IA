name: "VideoForge - auditar contato mãos e lanças de C01 sem IA"
on:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-auditar-bracos-guardas.json'
permissions:
  contents: write
concurrency:
  group: vf-guard-arm-rig-audit
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar pedido, segurança e ausência de geração
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01')
          p=json.loads((base/'pedido-auditar-bracos-guardas.json').read_text(encoding='utf8'))
          assert p['schema']=='videoforge/guard-arm-qa-request/v1'
          assert p['image_generation_calls']==0
          assert p['only_existing_pixels'] is True
          assert p['human_visual_approval'] is False
          assert p['youtube_upload'] is False
          assert (base/'SEM-GERACAO-NOVAS-IMAGENS.lock').is_file()
          PY
      - name: Instalar Pillow para ler PNGs, sem IA
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Verificar 10 hashes e contato físico sem aprovar rig
        run: |
          python -m videoforge.validate_guard_kinematics
      - name: Commitar resultado da auditoria no canal
        shell: bash
        run: |
          set -euo pipefail
          FILE='canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/qa-guardas-articulacoes-c01.json'
          git config user.name 'videoforge-archive[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(alchemy): documentar contato das luvas nas lanças e bloqueio de rig'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Não declarar animação concluída
        run: |
          echo 'Draft joints only, no approved underlay, no official MP4.'
