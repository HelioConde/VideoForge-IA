name: "VideoForge - EP01 lote antigo de camadas descontinuado"
run-name: "EP01 / conferir máscaras da mãe sem repetir proxy"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep01-layered-shot-batch.yml'
permissions:
  contents: read
jobs:
  legacy-check-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar plano da cena-mãe sem gerar bainha deslocada
        run: |
          set -euo pipefail
          python -m videoforge.layered_shot_plan
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-C01-P02-ESPADA-PIXELS.json').read_text())
          assert data['visual_approved'] is False and data['rig_authorized'] is False
          print('LEGACY_PROXY_LAYER_LOOP_DISABLED; use source pixel cutouts and human visual review')
          PY
