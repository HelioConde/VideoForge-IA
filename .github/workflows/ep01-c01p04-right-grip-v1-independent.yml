name: "VideoForge - EP01 C01-P04 V3 anatomia guarda direito"
run-name: "EP01 C01-P04 / guarda direito ${{ inputs.role || 'pedido' }}"
on:
  workflow_dispatch:
    inputs:
      role:
        description: "Qual subcamada separada desenhar"
        required: true
        type: choice
        options: [forearm-cuff, palm-rear, fingers-front]
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-ANATOMIA-GUARDA-DIREITO-C01-P04-V3.json'
permissions:
  contents: write
  packages: read
concurrency:
  group: ep01-c01p04-v3-right-grip-parts-main
  cancel-in-progress: false

jobs:
  gerar-camada-v3:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      CODEX_PROXY_BASE_URL: ${{ secrets.CODEX_PROXY_BASE_URL }}
      CODEX_PROXY_ACCOUNTS_JSON: ${{ secrets.CODEX_PROXY_ACCOUNTS_JSON }}
      INPUT_ROLE: ${{ inputs.role }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar checagem offline
        run: python -m pip install --quiet 'Pillow==11.3.0'
      - name: Validar biblia, SHA, contrato e impedir segunda chamada
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ep01_c01p04_right_grip_v1 -v
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from videoforge import ep01_c01p04_right_grip_v1 as engine
          p=Path("canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-ANATOMIA-GUARDA-DIREITO-C01-P04-V3.json")
          request=json.loads(p.read_text(encoding="utf-8"))
          if (request.get("schema")!="videoforge/ep01-c01p04-right-grip-v1-request/v1"
              or request.get("channel")!="alchemy-lab"
              or request.get("video_id")!="mmorpg-conquiste-a-princesa-ep01"
              or request.get("shot_id")!="C01-P04"
              or request.get("approved_original_sha256")!=engine.APPROVED_SHA
              or request.get("one_paid_call_per_part") is not True
              or request.get("retry_on_failure") is not False
              or request.get("save_native_png") is not True
              or request.get("no_pixel_cutout") is not True
              or request.get("visual_approval") is not False
              or request.get("rig_ready") is not False
              or request.get("youtube_upload") is not False):
              raise SystemExit("GRIP_V3_BAD_REQUEST")
          if os.environ["GITHUB_EVENT_NAME"]=="push":
              changed=subprocess.check_output(["git","diff-tree","--no-commit-id",
                  "--name-only","-r",os.environ["GITHUB_SHA"]],text=True).splitlines()
              if str(p) not in changed:
                  raise SystemExit("GRIP_V3_REQUEST_FILE_UNCHANGED")
              role=request["role"]
          else:
              role=os.environ.get("INPUT_ROLE","").strip()
          if role not in engine.ROLES:
              raise SystemExit("GRIP_V3_INVALID_ROLE")
          old=engine.archive(role)
          if old:
              print("GRIP_V3_ALREADY_ARCHIVED_NO_DUPLICATE",role,old["sha256"])
              execute="false"
          else:
              ref=engine.prep(role)
              print("GRIP_V3_PREFLIGHT_SHA_OK",role,len(ref["images"]))
              execute="true"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("execute="+execute+"\n")
              out.write("role="+role+"\n")
          PY
      - name: Preparar endpoint do proxy sem mostrar credenciais
        if: steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CODEX_PROXY_API_KEY" ]]; then
            echo "::error::CODEX_PROXY_API_KEY ausente"; exit 1
          fi
          if [[ -n "$CODEX_PROXY_BASE_URL" ]]; then
            printf 'PROXY_ENDPOINT=%s\n' "$CODEX_PROXY_BASE_URL" >> "$GITHUB_ENV"
          elif [[ -n "$CODEX_PROXY_ACCOUNTS_JSON" ]]; then
            echo 'PROXY_ENDPOINT=http://127.0.0.1:18080' >> "$GITHUB_ENV"
            echo 'USE_EPHEMERAL=1' >> "$GITHUB_ENV"
          else
            echo "::error::Falta URL ou contas do proxy"; exit 1
          fi
      - name: Inicializar proxy efemero publico precompilado
        if: steps.preflight.outputs.execute == 'true' && env.USE_EPHEMERAL == '1'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vf-proxy-state"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(os.environ["CODEX_PROXY_ACCOUNTS_JSON"])
          assert isinstance(data,dict) and isinstance(data.get("records"),list)
          assert data["records"] and all(isinstance(r,dict) and isinstance(r.get("token"),dict) for r in data["records"])
          p=Path(os.environ["RUNNER_TEMP"])/"vf-proxy-state"/"accounts.json"
          p.write_text(json.dumps(data),encoding="utf-8")
          p.chmod(0o600)
          PY
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          docker run -d --name vf-proxy-right-grip-v1 \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 \
            -e PROXY_API_KEY="$CODEX_PROXY_API_KEY" -e DATA_DIR=/app/data \
            -e DEBUG_LOG_PAYLOADS=false \
            -v "$RUNNER_TEMP/vf-proxy-state:/app/data:rw" \
            ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1 >/dev/null
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Proxy nao respondeu"; exit 1
      - name: Criar uma subcamada original RGBA pela IA
        if: steps.preflight.outputs.execute == 'true'
        env:
          ROLE: ${{ steps.preflight.outputs.role }}
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.proxy_images health --url "$PROXY_ENDPOINT"
          python -m videoforge.ep01_c01p04_right_grip_v1 --role "$ROLE" --url "$PROXY_ENDPOINT"
      - name: Arquivar PNG e SHA mesmo se falhou no gate tecnico
        if: always() && steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-c01p04-right-grip-v1-independent-part "${{ job.status }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.preflight.outputs.execute == 'true'
        with:
          name: ep01-right-grip-v1-${{ steps.preflight.outputs.role }}-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens/
          if-no-files-found: warn
          retention-days: 30
      - name: Limpar credenciais efemeras
        if: always()
        shell: bash
        run: |
          docker rm -f vf-proxy-right-grip-v1 >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vf-proxy-state"
