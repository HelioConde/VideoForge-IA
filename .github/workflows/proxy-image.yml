name: Preparar imagem Codex Proxy (build unico)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proxy-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: codex-proxy-image-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout do proxy upstream em commit fixo
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 02f8ce3581c15eb11b2d65daf93c3d4e3bd0e635
          path: proxy-src
          persist-credentials: false
      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Entrar no GHCR com token temporario do Actions
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar Go na imagem e publicar binario reutilizavel
        uses: docker/build-push-action@v6
        with:
          context: ./proxy-src
          file: ./proxy-src/Dockerfile
          push: true
          tags: ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          cache-from: type=gha,scope=videoforge-proxy
          cache-to: type=gha,mode=max,scope=videoforge-proxy
          provenance: true
      - name: Verificar imagem publicada sem utilizar contas
        shell: bash
        run: |
          set -euo pipefail
          docker pull "ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1"
          docker run -d --rm --name vf-proxy-health \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e PROXY_API_KEY=check-only-not-production \
            -p 127.0.0.1:18080:8080 "ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1" >/dev/null
          trap 'docker rm -f vf-proxy-health >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then
              echo "Imagem do proxy pronta para workflows (sem validar contas)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::A imagem iniciou sem responder /health/live."
          exit 1
