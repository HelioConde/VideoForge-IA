name: "VideoForge - EP01 C01-P04 V3 QA luva guarda V2"
run-name: "EP01 C01-P04 / QA da nova luva esquerda V2"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-QA-PEGADA-GUARDA-V2.json'
permissions:
  contents: write
concurrency:
  group: ep01-c01p04-v3-guard-grip-v2-qa-main
  cancel-in-progress: false
jobs:
  hand-contact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'Pillow==11.3.0'
      - name: Comparar V2 e antigas com 2 ordens de oclusao
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa_ep01_c01p04_v3_guard_grip_v2_review.py
      - name: Salvar pranchas e provas sem autorizar rig
        shell: bash
        run: |
          set -euo pipefail
          ep=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$ep/QA-C01-P04-V3-GUARDA-ESQUERDO-PEGADA-V2.jpg" "$ep/QA-C01-P04-V3-GUARDA-ESQUERDO-PEGADA-V2-PREVIEW.jpg" "$ep/QA-C01-P04-V3-GUARDA-ESQUERDO-PEGADA-V2-MAO-ZOOM.jpg" "$ep/QA-C01-P04-V3-GUARDA-ESQUERDO-PEGADA-V2.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(ep01): comparar luva de guarda V2 e lanças com oclusao'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep01-left-guard-grip-v2-qa
          path: canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-C01-P04-V3-GUARDA-ESQUERDO-PEGADA-V2*
          retention-days: 30
          if-no-files-found: warn
