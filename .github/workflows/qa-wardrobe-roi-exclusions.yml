name: "VideoForge - excluir contaminacoes candidatas do figurino"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'videoforge/wardrobe_roi_exclusions.py'
      - 'tests/test_wardrobe_roi_exclusions.py'
      - '.github/workflows/qa-wardrobe-roi-exclusions.yml'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/ROI-EXCLUSOES-CANDIDATAS-V2.json'
permissions:
  contents: write
concurrency:
  group: vf-wardrobe-exclusions
  cancel-in-progress: false
jobs:
  qa-exclusions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow sem fornecedor IA
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Validar subtracao e bloqueios
        run: python -m unittest tests.test_wardrobe_roi_exclusions -v
      - name: Exportar prancha original versus exclusao
        run: python -m videoforge.wardrobe_roi_exclusions --sync
      - name: Versionar unicamente QA da exclusao
        shell: bash
        run: |
          set -euo pipefail
          EP=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'videoforge-roi-qa[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$EP/assets/qa-roi-exclusions-v2/"
          git add "$EP/QA-ROI-EXCLUSOES-V2.jpg" "$EP/QA-ROI-EXCLUSOES-V2.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(dorama): registrar exclusoes candidatas das 8 ROIs'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
