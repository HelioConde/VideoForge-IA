name: 'Otaku BR - validar piscada natural com arte original (SEM IA)'
on:
  pull_request:
    paths:
      - 'videoforge/eye_refine.py'
      - 'videoforge/rig_candidate.py'
      - 'canal/otaku-br/videos/teste-proxy-20261113/rig-plan.json'
      - 'tests/test_eye_refine.py'
      - '.github/workflows/rig-eye-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  eye-qa-real-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/helioconde/videoforge-remotion-runner:legacy-ec85db5-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CHANNEL: otaku-br
      VIDEO_ID: teste-proxy-20261113
      SCENE: cena-01
      SOURCE_RUN: '43437992955'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar script de olhos e rig sem chamadas de modelo
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_eye_refine tests.test_rig_candidate -v
      - name: Baixar arte original verificada — sem regenerar cenas
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN }}
          name: camadas-advanced-otaku-br-teste-proxy-20261113-cena-01-${{ env.SOURCE_RUN }}
          path: ./source-layers
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refazer PNGs RGBA com pálpebras naturais
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.rig_candidate \
            --source-dir ./source-layers \
            --plan ./canal/otaku-br/videos/teste-proxy-20261113/rig-plan.json \
            --output-dir ./output/otaku-br/videos/teste-proxy-20261113/rig-candidates/cena-01
          python - <<'PY'
          import json
          from pathlib import Path
          target=Path("output/otaku-br/videos/teste-proxy-20261113/rig-candidates/cena-01")
          qa=json.loads((target/"candidate.qa.json").read_text())
          eye=qa["natural_eyelids_preview"]
          assert eye["eyes"]==2 and eye["external_model_calls"]==0
          assert "antialiased" in eye["technique"]
          assert eye["closed_lid_visible_pixels"]>=25
          assert qa["human_visual_approval"] is False
          assert qa["rig_ready_for_remotion"] is False
          print("Pixel-art anterior substituida por curvas, ainda RASCUNHO:",eye)
          PY
      - name: Preparar Remotion em modo RASCUNHO
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.rig_draft_preview prepare \
            --source-dir ./source-layers \
            --candidate-dir ./output/otaku-br/videos/teste-proxy-20261113/rig-candidates/cena-01 \
            --channel "$CHANNEL" --video-id "$VIDEO_ID" --scene "$SCENE"
          ln -s /opt/videoforge-remotion/node_modules motion-remotion/node_modules
      - name: Renderizar 5 quadros de piscar e nova capa
        shell: bash
        run: |
          set -euo pipefail
          cd motion-remotion
          ./node_modules/.bin/tsc --noEmit
          target="../output/$CHANNEL/videos/$VIDEO_ID/rig-draft-previews/$SCENE"
          for frame in 0 38 39 40 41 42 60 132; do
            ./node_modules/.bin/remotion still src/index.ts VideoForgeLayerScene \
              "$target/rig-draft-frame-$frame.png" --frame="$frame" \
              --props="$target/draft-props.json" --log=error
            test -s "$target/rig-draft-frame-$frame.png"
          done
      - name: Renderizar MP4 técnico de 8 segundos (com marca d agua)
        shell: bash
        run: |
          set -euo pipefail
          cd motion-remotion
          target="../output/$CHANNEL/videos/$VIDEO_ID/rig-draft-previews/$SCENE"
          ./node_modules/.bin/remotion render src/index.ts VideoForgeLayerScene \
            "$target/rig-draft-preview.mp4" \
            --props="$target/draft-props.json" --codec=h264 --concurrency=2 --log=error
      - name: Verificar movimento e status não publicável
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.rig_draft_preview verify \
            --channel "$CHANNEL" --video-id "$VIDEO_ID" --scene "$SCENE"
      - name: Exportar sprites e diagnóstico visual para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otaku-br-natural-blink-review-${{ github.run_id }}
          path: |
            output/otaku-br/videos/teste-proxy-20261113/rig-candidates/cena-01/eyes-closed.png
            output/otaku-br/videos/teste-proxy-20261113/rig-candidates/cena-01/eyes-open.png
            output/otaku-br/videos/teste-proxy-20261113/rig-candidates/cena-01/head-no-eyes.png
            output/otaku-br/videos/teste-proxy-20261113/rig-candidates/cena-01/head-open.png
            output/otaku-br/videos/teste-proxy-20261113/rig-candidates/cena-01/candidate.qa.json
            output/otaku-br/videos/teste-proxy-20261113/rig-candidates/cena-01/contact-sheet.png
            output/otaku-br/videos/teste-proxy-20261113/rig-draft-previews/cena-01/
          retention-days: 7
          if-no-files-found: warn
