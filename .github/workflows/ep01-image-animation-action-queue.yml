name: "EP01 - fila automatica de imagens e animacoes por Actions"
run-name: "EP01 fila de imagens e previas | ${{ github.event_name }}"

# Small sequential batches; one image = one existing, isolated child Action.
# Full articulated animations remain BLOCKED until real RGBA + rig QA.
on:
  pull_request:
    paths:
      - '.github/workflows/ep01-image-animation-action-queue.yml'
      - '.github/workflows/ep01-camera-batch-preview.yml'
      - 'scripts/ep01_action_production_queue.py'
      - 'tests/test_ep01_action_production_queue.py'
      - 'tests/test_ep01_queue_canvas_recovery.py'
      - 'tests/test_ep01_proxy_separate_parts.py'
      - 'scripts/ep01_layer_gallery.py'
      - 'tests/test_ep01_layer_gallery.py'
      - 'videoforge/ep01_proxy_separate_parts.py'
      - 'scripts/ep01_proxy_qa_feedback.py'
      - 'tests/test_ep01_proxy_qa_feedback.py'
      - '.github/workflows/ep01-proxy-separate-part-by-request.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep01-image-animation-action-queue.yml'
      - 'scripts/ep01_action_production_queue.py'
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = no child dispatch; run = bounded image/preview children"
        type: choice
        options: [plan, run]
        required: true
        default: run
      max_images:
        description: "Maximum PAID image-generation children for this batch (0-20)"
        type: number
        required: true
        default: 2
      max_previews:
        description: "Maximum UNPAID camera-only review children for this batch (0-12)"
        type: number
        required: true
        default: 2
  # Four UTC slots daily; each remains capped to 2 images + 2 camera previews.
  # Ledger reservations and per-child no-replay rules remain unchanged.
  schedule:
    - cron: "37 2,8,14,20 * * *"

permissions:
  contents: read

concurrency:
  group: ep01-versioned-image-and-preview-queue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-queue-pr:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AI_ENABLED: 'false'
      PAID_CALLS_ENABLED: 'false'
      IMAGE_GENERATION_ENABLED: 'false'
      YOUTUBE_PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for SHA-pinned original images
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Verify all 42 shots, old image parts, no-replay and rig gates
        run: |
          python -m unittest discover -s tests -p 'test_ep01_layer_gallery.py' -v
          python -m unittest discover -s tests -p 'test_ep01_action_production_queue.py' -v
          python -m unittest discover -s tests -p 'test_ep01_queue_canvas_recovery.py' -v
          python -m unittest discover -s tests -p 'test_ep01_proxy_separate_parts.py' -v
          python -m unittest discover -s tests -p 'test_ep01_proxy_qa_feedback.py' -v
      - name: Syntax-check GitHub issue updater JavaScript, not only Python
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          workflow=Path('.github/workflows/ep01-image-animation-action-queue.yml').read_text()
          js=workflow.rsplit('          script: |',1)[1].split('\n      - name:',1)[0]
          lines=js.splitlines()
          source='\n'.join(line[12:] if line.startswith('            ') else line for line in lines)
          target=Path('/tmp/ep01-queue-issue-check.cjs')
          target.write_text('(async function () {\n'+source+'\n})()\n',encoding='utf-8')
          subprocess.run(['node','--check',str(target)],check=True)
          print('GITHUB_ISSUE_SCRIPT_JS_PARSE_OK')
          PY
      - name: Generate complete offline 42-shot image/animation work order
        run: |
          python -m scripts.ep01_action_production_queue --mode plan \
            --output "$RUNNER_TEMP/ep01-production-queue-plan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep01-production-queue-plan-PR-${{ github.run_id }}
          path: ${{ runner.temp }}/ep01-production-queue-plan.json
          if-no-files-found: ignore
          retention-days: 14

  run-action-queue:
    if: >-
      github.repository == 'HelioConde/VideoForge-IA'
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      AI_ENABLED: 'false'
      PAID_CALLS_ENABLED: 'false'
      YOUTUBE_PUBLICATION_ENABLED: 'false'
      MAX_IMAGES: ${{ inputs.max_images }}
      MAX_PREVIEWS: ${{ inputs.max_previews }}
      # Code pushes only validate/plan; paid batches need schedule or explicit run.
      QUEUE_MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'run' || 'plan') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only image validation tools
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Validate actual queue and anti-replay state contracts before any paid work
        run: |
          python -m unittest discover -s tests -p 'test_ep01_action_production_queue.py' -v
          python -m unittest discover -s tests -p 'test_ep01_queue_canvas_recovery.py' -v
          python -m unittest discover -s tests -p 'test_ep01_proxy_separate_parts.py' -v
          python -m unittest discover -s tests -p 'test_ep01_proxy_qa_feedback.py' -v
          gh auth status
      - name: Write a complete reusable queue plan FIRST (no provider calls)
        run: |
          set -euo pipefail
          python -m scripts.ep01_action_production_queue --mode plan \
            --output "$RUNNER_TEMP/ep01-production-queue-plan.json"
      - name: Dispatch at most 2 image child Actions and 2 camera previews by default
        env:
          EP01_SHOW_ACTIVE_CHILD: "true"
        if: env.QUEUE_MODE == 'run'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MAX_IMAGES" ]]; then MAX_IMAGES=2; fi
          if [[ -z "$MAX_PREVIEWS" ]]; then MAX_PREVIEWS=2; fi
          python -m scripts.ep01_action_production_queue --mode run \
            --max-images "$MAX_IMAGES" --max-previews "$MAX_PREVIEWS" \
            --output "$RUNNER_TEMP/ep01-production-queue-execution.json"
      - name: Update the public queue panel using actual children and state
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_FILE: ${{ runner.temp }}/ep01-production-queue-plan.json
          RUN_FILE: ${{ runner.temp }}/ep01-production-queue-execution.json
        with:
          script: |
            const fs=require('fs');
            if(!fs.existsSync(process.env.PLAN_FILE)){
              core.warning('Queue planning itself failed. No progress may be claimed.');
              return;
            }
            const input=JSON.parse(fs.readFileSync(process.env.PLAN_FILE,'utf8'));
            const data=input.queue;
            if(data.schema!=='videoforge/ep01-production-action-queue/v1' ||
               data.shots!==42 || data.original_image_requests!==146 ||
               data.total_tasks!==276 || data.per_child_paid_image_cap!==1 ||
               data.youtube_publication!==false || data.rig_approval_automatic!==false)
              throw new Error('Queue planner did not pass immutable EP01 source contract');
            const count=(kind,status)=>data.tasks.filter(x=>x.kind===kind &&
              (!status || x.status===status)).length;
            const old=count('image');
            const ready=count('image','ready_for_preflight');
            const blocked=data.tasks.filter(x=>x.kind==='image' &&
              x.status.startsWith('blocked')).length;
            let ledger={schema_version:1,schema:'videoforge/ep01-production-action-queue-state/v1',attempts:{}};
            try{
              const {data:state}=await github.rest.repos.getContent({
                ...context.repo,path:'runtime/ep01-production-action-queue-v1.json',
                ref:'state/multi-agent-runtime'
              });
              const remote=JSON.parse(Buffer.from(state.content,'base64').toString('utf8'));
              if(remote.schema!==ledger.schema || remote.schema_version!==1 ||
                 typeof remote.attempts!=='object')
                throw new Error('Queue remote state schema changed');
              ledger=remote;
            }catch(error){
              if(error.status!==404)throw error;
              core.warning('Queue CAS not initialized: no child is claimed completed.');
            }
            const path=require('path');
            const ledgerFile=path.join(process.env.RUNNER_TEMP,'ep01-gallery-ledger.json');
            fs.writeFileSync(ledgerFile,JSON.stringify(ledger));
            require('child_process').execFileSync('python',['-m','scripts.ep01_layer_gallery',
              process.env.PLAN_FILE,ledgerFile,path.join(process.env.RUNNER_TEMP,'ep01-camadas.html')]);
            const attempts=Object.entries(ledger.attempts);
            const completed=attempts.filter(([,x])=>
              x.status==='archived'||x.status==='preview_complete');
            const rejected=attempts.filter(([,x])=>x.status==='rejected_archived');
            const pending=attempts.filter(([,x])=>
              !['archived','preview_complete','blocked_preflight','rejected_archived'].includes(x.status));
            let result=null;
            if(fs.existsSync(process.env.RUN_FILE)){
              result=JSON.parse(fs.readFileSync(process.env.RUN_FILE,'utf8')).execution;
              if(result?.youtube_publications!==0||result?.human_visual_approval!==false)
                throw new Error('Unexpected approval or publishing in execution');
            }
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rows=attempts.slice(-25).reverse().map(([id,item])=>{
              const child=item.child_run_id
                ?`[Action ${item.child_run_id}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${item.child_run_id})`
                :'sem run verificado';
              const png=item.source_file && item.sha256
                ? '[PNG](https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/blob/main/'+encodeURI(item.source_file)+')' : '—';
              const seconds=Number.isInteger(item.elapsed_seconds)?item.elapsed_seconds+' s':'—';
              return '| ' + id + ' | ' + item.status + ' | ' + child + ' | '+png+' | '+seconds+' |';
            });
            // Derive per-shot feedback from both the immutable plan and the durable CAS ledger.
            const byId=new Map(data.tasks.map(t=>[t.task_id,t]));
            const ledgerStatus=t=>ledger.attempts[t.task_id]?.status || t.status;
            const items=kind=>data.tasks.filter(t=>t.kind===kind);
            const imageTasks=items('image');
            const isArchived=t=>['archived'].includes(ledgerStatus(t));
            const isRejected=t=>['rejected_archived','archived_rejected_needs_review'].includes(ledgerStatus(t));
            const isBlocked=t=>ledgerStatus(t).startsWith('blocked') || ledgerStatus(t)==='archived_version_check_needed';
            const imageArchived=imageTasks.filter(isArchived).length;
            const imageRejected=imageTasks.filter(isRejected).length;
            const imageBlocked=imageTasks.filter(isBlocked).length;
            const imageReady=imageTasks.filter(t=>ledgerStatus(t)==='ready_for_preflight').length;
            const previewDone=items('camera_preview').filter(t=>ledgerStatus(t)==='preview_complete').length;
            const rigDone=items('rig_animation').filter(t=>ledgerStatus(t)==='animation_complete_and_qa_approved').length;
            const childLink=t=>{
              const id=ledger.attempts[t.task_id]?.child_run_id;
              return id?`[Action ${id}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${id})`:'—';
            };
            const shotIds=[...new Set(data.tasks.filter(t=>t.kind==='mother').map(t=>t.shot_id))];
            const shotRows=shotIds.map(shot=>{
              const img=imageTasks.filter(t=>t.shot_id===shot);
              const ready=img.filter(t=>ledgerStatus(t)==='ready_for_preflight').length;
              const archived=img.filter(isArchived).length;
              const rejected=img.filter(isRejected).length;
              const blocked=img.filter(isBlocked).length;
              const prev=items('camera_preview').find(t=>t.shot_id===shot);
              const anim=items('rig_animation').find(t=>t.shot_id===shot);
              const previewText=prev && ledgerStatus(prev)==='preview_complete'?`Prévia pronta (${childLink(prev)})`:'Aguardando prévia';
              const animationText=anim && ledgerStatus(anim)==='animation_complete_and_qa_approved'?'QA aprovado':'Bloqueada: camadas/rig/QA';
              const mother=items('mother').find(t=>t.shot_id===shot);
              const source=mother?.source_file?`[PNG](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/${encodeURI(mother.source_file)})`:'quadro preto';
              const previewReceipt=prev && ledger.attempts[prev.task_id];
              const previewArtifact=previewReceipt?.artifact_id && previewReceipt.child_run_id
                ? ` · [MP4 no artifact](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${previewReceipt.child_run_id}/artifacts/${previewReceipt.artifact_id})`:'';
              const animated=anim && ledgerStatus(anim)==='animation_complete_and_qa_approved';
              const downstream=animated?'QA temporal concluída · render final aguarda montagem':'QA temporal e render aguardam animação';
              return `| ${shot} | ${source} | ${archived}/${img.length} arquivadas; ${ready} prontas; ${blocked} bloqueadas; ${rejected} rejeitadas | ${previewText}${previewArtifact} | ${animationText} | ${downstream} |`;
            });
            const problemRows=data.tasks.filter(t=>['image','image_correction'].includes(t.kind))
              .filter(t=>isRejected(t)||isBlocked(t)).slice(0,15).map(t=>{
                const state=ledgerStatus(t);
                const reason=ledger.attempts[t.task_id]?.technical_qa || ledger.attempts[t.task_id]?.reason || t.reason;
                const brief=String(reason||'não informado').replace(/[\r\n|]/g,' ').slice(0,130);
                return `| ${t.shot_id} / ${t.part||'-'} | ${state} | ${brief} | ${childLink(t)} |`;
              });
            const active=data.tasks.filter(t=>['reserved','dispatched'].includes(ledgerStatus(t)));
            let cut=null;
            try {
              const {data:cuts}=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'ep01-review-cut.yml',
                event:'workflow_dispatch',branch:'main',status:'success',per_page:1});
              const run=cuts.workflow_runs[0];
              if(run){
                const {data:files}=await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:run.id});
                const file=files.artifacts.find(a=>!a.expired && a.size_in_bytes>0 && a.name==='ep01-previa-parcial-camera-'+run.id);
                if(file)cut=run.html_url+'/artifacts/'+file.id;
              }
            }catch(error){core.warning('Consulta à montagem parcial indisponível');}
            const feedbackLines=[
              '## Feedback de produção — imagens, prévias e animações',
              '',
              '**Atualização automática a cada execução do controlador** (não é transmissão em tempo real). Todos os números abaixo são baseados no plano versionado e no ledger CAS persistente.',
              '',
              `- **Imagens separadas:** ${imageArchived} arquivadas entre ${imageTasks.length} solicitações originais; ${imageReady} prontas para pré-verificação; ${imageBlocked} bloqueadas; ${imageRejected} rejeitadas para revisão. Incluindo as rejeitadas preservadas: ${imageArchived+imageRejected} registros de arquivo nessas duas categorias. Aprovações visuais individuais da fila: ${imageTasks.filter(t=>ledger.attempts[t.task_id]?.human_visual_approval===true).length}.`,
              `- **Prévia de câmera:** ${previewDone}/42 concluídas; apenas camera-only, sem rig.`,
              `- **Animação articulada real:** ${rigDone}/42 com conclusão e QA registrados; demais aguardam RGBA, rig, animação e aprovação visual.`,
              `- **Correções especiais C08:** ${items('image_correction').map(t=>t.shot_id+' '+t.part+' ('+ledgerStatus(t)+')').join(', ')}.`,
              `- **Estado do último lote:** ${result ? result.processed_images+' imagens e '+result.processed_camera_previews+' prévias despachadas' : 'sem execução confirmada neste ciclo'}.`,
              '',
              '**Status:** arquivada = PNG salvo com evidência, não arte aprovada; rejeitada = resultado preservado, sem repetição automática; bloqueada = exige correção; prévia = só câmera; animação = exige camadas e rig verdadeiros.',
              '',
              'Em processamento no último registro: '+(active.map(t=>t.task_id+' (Agente '+t.owner+')').join(', ')||'nenhuma reserva ativa')+'.',
              ...(cut?['[Baixar montagem parcial em MP4]('+cut+') · câmera sem rig ou áudio final.']:[]),
              'Galeria de todas as tomadas: abrir **ep01-camadas.html** no [artifact do controlador]('+runUrl+'). Inclui miniaturas, PNGs, fontes, responsáveis e arquivos das prévias.',
              'QA visual do Agente 12: requer parecer específico por tomada. Rig, QA temporal e render final aguardam material liberado.',
              '',
              '### Progresso por tomada',
              '',
              '| Tomada | Imagem-mãe | Camadas | Prévia de câmera | Animação articulada | QA temporal e render |',
              '|---|---|---|---|---|---|',
              ...shotRows,
              '',
              '### Problemas que precisam de ação (primeiros 15)',
              '',
              '| Tomada / componente | Situação | Motivo | Evidência |',
              '|---|---|---|---|',
              ...(problemRows.length?problemRows:['| — | Nenhum bloqueio no plano | — | — |']),
              '',
              '**Revisão visual humana:** pendente enquanto a imagem não for explicitamente aprovada. Nunca inferir aprovação de um workflow verde.',
              ''
            ];
            const text=[
              '<!-- videoforge-ep01-production-queue:v1 -->',
              '# Fila de imagens e animacoes — EP01 (42 tomadas)',
              '',
              `**Ultima atualizacao:** [Action ${context.runId}](${runUrl}) — resultado: ${context.job || 'run'}.`,
              '',
              `- **Imagens-mae:** 42 slots, incluindo C01-P01 preto sem PNG; fontes reutilizadas por SHA.`,
              `- **Pecas da fila original:** ${old} solicitacoes, ${ready} candidatas a preflight, ${blocked} com referencias bloqueadas.`,
              `- **Correcoes C08 novas:** consultar o estado individual das quatro tarefas abaixo.`,
              '- **Previas de camera:** 42 tarefas tecnicas; NAO sao rigs ou animacoes de personagens.',
              '- **Animacoes articuladas:** 42 tarefas bloqueadas ate ter camadas RGBA autenticas e QA visual.',
              `- **Execucoes-filhas com evidencia persistente:** ${completed.length}; rejeitadas/arquivadas sem replay: ${rejected.length}; reservas/falhas nao resolvidas: ${pending.length}.`,
              `- **Ultimo lote:** ${result ? result.processed_images+' imagens e '+result.processed_camera_previews+' previas' : 'nenhum resultado de dispatch declarado'}.`,
              '',
              '**Regras:** cada imagem custa no maximo uma chamada no workflow filho; nunca reexecutar uma chamada com estado incerto. Nem imagem-mãe, figurino, pegada, rig ou episodio ficam aprovados por uma Action verde. Nao publica YouTube.',
              '',
              ...feedbackLines,
              '## Historico de tarefas enviadas',
              '',
              '| Tarefa | Estado verificavel | Action filha | Imagem | Tempo observado |',
              '|---|---|---|---|---|',
              ...rows,
              '',
              '**Plano completo:** consultar o artifact da Action acima com as 276 tarefas, bloqueios e SHA.',
              '',
            ].join('\n');
            const {data:issue}=await github.rest.issues.get({
              ...context.repo,issue_number:98
            });
            if(issue.state!=='open' ||
               !issue.body?.startsWith('<!-- videoforge-ep01-production-queue:v1 -->'))
              throw new Error('Public queue issue was closed or replaced');
            await github.rest.issues.update({
              ...context.repo,issue_number:98,body:text
            });
            await core.summary.addRaw(text).write();
      - name: Archive complete planned tasks and real child run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-image-animation-action-queue-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ep01-production-queue-plan.json
            ${{ runner.temp }}/ep01-production-queue-execution.json
            ${{ runner.temp }}/ep01-camadas.html
          retention-days: 30
          if-no-files-found: ignore
