name: "Agents - authorized one-shot real Astra 01 ping"

# Owner explicitly authorized the next live diagnostic on 18 Nov 2026.
# Only the unique squash-merge commit title below triggers this job.
# One provider request, no tool use, no video publication, never replay.
on:
  pull_request:
    paths:
      - '.github/workflows/agent-astra-authorized-once.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-astra-authorized-once.yml'

permissions:
  contents: read
  packages: read

jobs:
  pr-offline-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AI_ENABLED: 'false'
      PAID_CALLS_ENABLED: 'false'
      CODEX_PROXY_TEXT_AUTHORIZED: 'false'
      IMAGE_GENERATION_ENABLED: 'false'
      YOUTUBE_PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline model selection and ping safety without network
        run: |
          python -m unittest discover -s tests -p 'test_astra_model_selection.py' -v
          python -m unittest discover -s tests -p 'test_agent_01_ping.py' -v

  real-ping-once:
    if: >-
      github.event_name == 'push'
      && github.repository == 'HelioConde/VideoForge-IA'
      && github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'ci(agents): authorized one-shot Astra Agent 01 ping')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: agent-codex-text-pilot-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      CODEX_PROXY_ACCOUNTS_JSON: ${{ secrets.CODEX_PROXY_ACCOUNTS_JSON }}
      CODEX_PROXY_BASE_URL: http://127.0.0.1:18080
      AI_ENABLED: 'false'
      PAID_CALLS_ENABLED: 'false'
      CODEX_PROXY_TEXT_AUTHORIZED: 'false'
      IMAGE_GENERATION_ENABLED: 'false'
      YOUTUBE_PUBLICATION_ENABLED: 'false'
    steps:
      - name: Permit exactly one attempt without media and without a billing claim
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_RUN_ATTEMPT:-0}" != "1" ]]; then
            echo '::error::Rerun forbidden; one authorized provider call may already have occurred.'
            exit 2
          fi
          if [[ -z "$CODEX_PROXY_API_KEY" || -z "$CODEX_PROXY_ACCOUNTS_JSON" ]]; then
            echo '::error::Existing proxy secrets are missing. No inference attempted.'
            exit 2
          fi
          echo 'User authorized ONE live Astra Agent 01 ping; unpriced proxy call, NOT a USD billing guarantee.'
          echo 'AI remains disabled until authenticated model selection is complete.'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore authorized session privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vf-astra-one-shot"
          python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              state=json.loads(os.environ['CODEX_PROXY_ACCOUNTS_JSON'])
              records=state.get('records') if isinstance(state,dict) else None
              if not isinstance(records,list) or not records or not all(
                  isinstance(x,dict) and isinstance(x.get('token'),dict) for x in records):
                  raise ValueError('Invalid snapshot')
              f=Path(os.environ['RUNNER_TEMP'])/'vf-astra-one-shot'/'accounts.json'
              f.write_text(json.dumps(state,ensure_ascii=False),encoding='utf-8')
              f.chmod(0o600)
              print('Private account snapshot loaded without printing credentials.')
          except (KeyError, ValueError, TypeError):
              raise SystemExit('Account snapshot invalid; zero inference requests.')
          PY
      - name: Boot existing precompiled loopback proxy
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          docker run -d --name vf-astra-authorized-once --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 \
            -e PROXY_API_KEY="$CODEX_PROXY_API_KEY" -e DATA_DIR=/app/data -e DEBUG_LOG_PAYLOADS=false \
            -v "$RUNNER_TEMP/vf-astra-one-shot:/app/data:rw" \
            ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1 >/dev/null
          for i in {1..30}; do
            if curl --noproxy '*' -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then
              echo 'Ephemeral proxy ready for GET catalog validation.'
              exit 0
            fi
            sleep 2
          done
          echo '::error::Ephemeral proxy did not become ready.'
          exit 2
      - name: Authenticate GET and pin Astra model before paid inference
        shell: bash
        run: |
          set -euo pipefail
          python -m orchestrator.proxy_preflight \
            --output "$RUNNER_TEMP/agent-astra-preflight.json" \
            --prefer-model gpt-6.2-astra --fallback-model gpt-6-astra
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'agent-astra-preflight.json').read_text())
          model=p.get('selected_model')
          if model not in ('gpt-6.2-astra','gpt-6-astra') or p.get('authenticated') is not True:
              raise SystemExit('No authorized authenticated Astra model; zero POST calls.')
          if p.get('inference_requests') != 0:
              raise SystemExit('Unexpected inference during GET-only preflight.')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              print('AI_MODEL='+model,file=f)
          print('Authenticated Astra model pinned before one POST: '+model)
          PY
      - name: Execute exactly one explicitly authorized real Agent 01 ping
        shell: bash
        env:
          AI_ENABLED: 'true'
          PAID_CALLS_ENABLED: 'true'
          CODEX_PROXY_TEXT_AUTHORIZED: 'true'
          IMAGE_GENERATION_ENABLED: 'false'
          YOUTUBE_PUBLICATION_ENABLED: 'false'
        run: |
          set -euo pipefail
          # Existing agent_ping.py enforces one request, no automatic retry,
          # max_output_tokens=500, input_token_limit=25000, timeout_seconds=60.
          # Unpriced means there is NO VERIFIED USD CEILING for this request.
          python -m orchestrator.agent_ping --mode codex_proxy --budget-usd uncapped \
            --output "$RUNNER_TEMP/agent-astra-real-ping.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'agent-astra-real-ping.json').read_text())
          if not (r.get('llm_executed') is True and r.get('simulated') is False
                  and r.get('model') == os.environ['AI_MODEL']
                  and r.get('agent_id') == '01' and r.get('reply',{}).get('status') == 'received'
                  and r.get('reply',{}).get('agent_id') == '01'
                  and r.get('reply',{}).get('human_visual_approval') is False
                  and r.get('human_visual_approval') is False
                  and r.get('production_actions') == 0
                  and r.get('youtube_publication') is False):
              raise SystemExit('The single real ping did not satisfy its evidence contract')
          print('LIVE ASTRA AGENT 01 PING VERIFIED: model='+r['model']+
                ', input_tokens='+str(r['usage'].get('input_tokens'))+
                ', output_tokens='+str(r['usage'].get('output_tokens')))
          print('Media generation, publishing and extra model calls: zero.')
          PY
      - name: Preserve sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorized-agent-01-astra-ping-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent-astra-preflight.json
            ${{ runner.temp }}/agent-astra-real-ping.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Delete private session and stop proxy
        if: always()
        shell: bash
        run: |
          docker rm -f vf-astra-authorized-once >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vf-astra-one-shot"
