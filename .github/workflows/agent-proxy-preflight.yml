name: "Agents - Codex proxy preflight (health/models only)"

# Manual by design. This workflow NEVER makes text/image inference requests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-proxy-preflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  connectivity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CODEX_PROXY_BASE_URL: ${{ secrets.CODEX_PROXY_BASE_URL }}
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      AI_ENABLED: "false"
      PAID_CALLS_ENABLED: "false"
      CODEX_PROXY_TEXT_AUTHORIZED: "false"
      IMAGE_GENERATION_ENABLED: "false"
      YOUTUBE_PUBLICATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar somente health e models, sem gerar IA
        run: |
          python -m orchestrator.proxy_preflight --output "$RUNNER_TEMP/proxy-preflight.json"
      - name: Arquivar evidencias sanitizadas
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/proxy-preflight.json
          if-no-files-found: error
          retention-days: 7
