name: "EP01 - carrinho articulated kinematics QA (DEBUG, no art)"

on:
  pull_request:
    paths:
      - '.github/workflows/ep01-cart-kinematics-debug.yml'
      - 'videoforge/ep01_cart_kinematics.py'
      - 'videoforge/ep01_continuity_motion.py'
      - 'tests/test_ep01_cart_kinematics.py'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PROPOSTA-MOVIMENTO-C07-C08-V1.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ep01-cart-kinematics-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kinematics-qa:
    if: >-
      github.repository == 'HelioConde/VideoForge-IA'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      AI_ENABLED: 'false'
      PAID_CALLS_ENABLED: 'false'
      CODEX_PROXY_TEXT_AUTHORIZED: 'false'
      IMAGE_GENERATION_ENABLED: 'false'
      YOUTUBE_PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Pillow for clearly labelled engineering wireframe
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Verify original continuity and 240-frame mechanical contact
        run: |
          python -m unittest discover -s tests -p 'test_ep01_cart_kinematics.py' -v
          python -m unittest discover -s tests -p 'test_ep01_continuity_motion.py' -v
      - name: Produce kinematic keyframe record and 8s debug wireframe MP4 (no PNG input)
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.ep01_cart_kinematics --output-dir "$RUNNER_TEMP/ep01-cart-kinematics" --render-wireframe
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'ep01-cart-kinematics'
          qa=json.loads((out/'kinematics-qa.json').read_text())
          raw=json.loads((out/'kinematics-frames.json').read_text())
          assert qa['frames_checked']==240
          assert qa['pivot_frames']==130 and qa['barricade_hold_frames']==110
          assert qa['cart_yaw_end_degrees']==90 and qa['continuous_cut'] is True
          assert qa['max_wheel_contact_slip_m'] < 1e-8
          assert qa['max_grip_connection_error_m'] < 1e-8
          assert qa['source_png_transforms']==0 and qa['sprite_layers_loaded']==0
          assert qa['rig_with_real_assets_approved'] is False
          assert qa['visual_art_approved'] is False and qa['full_animation_approved'] is False
          assert qa['youtube_publications']==0
          assert len(raw['frames'])==240 and raw['production_ready'] is False
          mp4=out/'cart-physics-wireframe-debug.mp4'
          result=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-select_streams','v:0',
              '-show_entries','stream=nb_frames,width,height,avg_frame_rate,codec_name',
              '-of','json',str(mp4)],text=True))
          stream=result['streams'][0]
          assert (stream['codec_name'],stream['width'],stream['height'],
                  stream['avg_frame_rate'],int(stream['nb_frames'])) == (
                      'h264',720,480,'30/1',240)
          digest=hashlib.sha256(mp4.read_bytes()).hexdigest()
          (out/'cart-physics-wireframe-debug.mp4.sha256').write_text(digest+'\n')
          print('KINEMATICS_OK 240/240 frames, wheels rolling and Kael grip connected; REAL PNG rig NOT approved')
          PY
      - name: Upload read-only technical debug, full-frame QA and SHA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-cart-physical-controller-debug-${{ github.run_id }}
          path: ${{ runner.temp }}/ep01-cart-kinematics/
          retention-days: 14
          if-no-files-found: error
