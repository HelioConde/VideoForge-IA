name: "VideoForge - EP01 corrigir Kael de frente para o trono V3"
run-name: "EP01 Kael rumo ao trono V3 ${{ inputs.target || 'pedido' }}"
on:
  workflow_dispatch:
    inputs:
      target:
        description: "C01-P03, C01-P04 ou C01-P04-ALT"
        required: true
        type: choice
        options: [C01-P03, C01-P04, C01-P04-ALT]
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-CORRECAO-ORIENTACAO-V3.json'

permissions:
  contents: write
  packages: read

concurrency:
  group: ep01-throne-facing-v3-main
  cancel-in-progress: false

jobs:
  gerar-correcao:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      CODEX_PROXY_BASE_URL: ${{ secrets.CODEX_PROXY_BASE_URL }}
      CODEX_PROXY_ACCOUNTS_JSON: ${{ secrets.CODEX_PROXY_ACCOUNTS_JSON }}
      INPUT_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar Bible SHA / fontes V2, requisitos sem gastar chamadas
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ep01_throne_orientation_v3 -v
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from videoforge import ep01_throne_orientation_v3 as engine
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              target = os.environ.get("INPUT_TARGET","").strip()
          else:
              expected = Path("canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-CORRECAO-ORIENTACAO-V3.json")
              changed = subprocess.check_output(
                  ["git","diff-tree","--no-commit-id","--name-only","-r",os.environ["GITHUB_SHA"]],
                  text=True).splitlines()
              if str(expected) not in changed:
                  raise SystemExit("THRONE_V3_REQUEST_NOT_CHANGED")
              data=json.loads(expected.read_text(encoding="utf-8"))
              if (data.get("schema")!="videoforge/ep01-throne-orientation-request/v1"
                  or data.get("channel")!="alchemy-lab"
                  or data.get("video_id")!="mmorpg-conquiste-a-princesa-ep01"
                  or data.get("human_visual_approval") is not False
                  or data.get("approved_for_final_render") is not False
                  or data.get("max_chargeable_calls_per_run")!=1
                  or data.get("retry_on_429") is not False
                  or data.get("youtube_upload") is not False):
                  raise SystemExit("THRONE_V3_INVALID_REQUEST")
              target = data.get("target","")
          if target not in engine.SOURCE_SHOTS:
              raise SystemExit("THRONE_V3_INVALID_TARGET")
          previous=engine.archived(target)
          if previous:
              execute="false"
              print("THRONE_V3_SKIP_ALREADY_ARCHIVED",target,previous["sha256"])
          else:
              spec=engine.prepare(target)
              execute="true"
              print("THRONE_V3_PREFLIGHT_SHA_OK",target,len(spec["images"]),"references")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              output.write("target="+target+"\n")
              output.write("execute="+execute+"\n")
          PY
      - name: Validar Codex Proxy sem mostrar credenciais
        if: steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CODEX_PROXY_API_KEY" ]]; then
            echo "::error::CODEX_PROXY_API_KEY ausente"; exit 1
          fi
          if [[ -n "$CODEX_PROXY_BASE_URL" ]]; then
            printf 'PROXY_ENDPOINT=%s\n' "$CODEX_PROXY_BASE_URL" >> "$GITHUB_ENV"
          elif [[ -n "$CODEX_PROXY_ACCOUNTS_JSON" ]]; then
            echo 'PROXY_ENDPOINT=http://127.0.0.1:18080' >> "$GITHUB_ENV"
            echo 'USE_EPHEMERAL=1' >> "$GITHUB_ENV"
          else
            echo "::error::Proxy sem contas ou URL configuradas"; exit 1
          fi
      - name: Iniciar proxy efemero existente
        if: steps.preflight.outputs.execute == 'true' && env.USE_EPHEMERAL == '1'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vf-proxy-state"
          python - <<'PY'
          import json,os
          from pathlib import Path
          value=json.loads(os.environ["CODEX_PROXY_ACCOUNTS_JSON"])
          assert isinstance(value,dict) and isinstance(value.get("records"),list)
          assert value["records"] and all(isinstance(x,dict) and isinstance(x.get("token"),dict) for x in value["records"])
          p=Path(os.environ["RUNNER_TEMP"])/"vf-proxy-state"/"accounts.json"
          p.write_text(json.dumps(value),encoding="utf-8")
          p.chmod(0o600)
          PY
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          docker run -d --name vf-proxy-throne-v3 \
            --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 \
            -e PROXY_API_KEY="$CODEX_PROXY_API_KEY" -e DATA_DIR=/app/data \
            -e DEBUG_LOG_PAYLOADS=false \
            -v "$RUNNER_TEMP/vf-proxy-state:/app/data:rw" \
            ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1 >/dev/null
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Proxy nao respondeu /health/live"; exit 1
      - name: Gerar imagem-mae V3 com Kael de frente para trono
        if: steps.preflight.outputs.execute == 'true'
        env:
          TARGET: ${{ steps.preflight.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.proxy_images health --url "$PROXY_ENDPOINT"
          python -m videoforge.ep01_throne_orientation_v3 --target "$TARGET" --url "$PROXY_ENDPOINT"
      - name: Arquivar PNG original SHA e registro na Biblia
        if: always() && steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-scene-mother-orientation-v3 "${{ job.status }}"
      - name: Preservar candidato para auditoria
        if: always() && steps.preflight.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vf-ep01-throne-v3-${{ steps.preflight.outputs.target }}-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens/
          retention-days: 30
          if-no-files-found: warn
      - name: Apagar tokens efemeros
        if: always()
        shell: bash
        run: |
          docker rm -f vf-proxy-throne-v3 >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vf-proxy-state"
