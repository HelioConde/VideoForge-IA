name: "VideoForge - EP01 C01-P04 V3 gerar imagem independente"
run-name: "EP01 C01-P04 V3 / parte ${{ inputs.part || 'pedido' }}"
on:
  workflow_dispatch:
    inputs:
      part:
        description: "Parte independente da C01-P04 aprovada"
        type: choice
        required: true
        options:
          - background-clean
          - character-kael
          - character-aldric
          - character-guarda_esquerdo
          - character-guarda_direito
          - object-lanca-esquerda
          - object-lanca-direita
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-PARTE-C01-P04-V3.json'

permissions:
  contents: write
  packages: read

concurrency:
  group: ep01-c01p04-v3-independent-part-main
  cancel-in-progress: false

jobs:
  gerar-parte-independente:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODEX_PROXY_API_KEY: ${{ secrets.CODEX_PROXY_API_KEY }}
      CODEX_PROXY_BASE_URL: ${{ secrets.CODEX_PROXY_BASE_URL }}
      CODEX_PROXY_ACCOUNTS_JSON: ${{ secrets.CODEX_PROXY_ACCOUNTS_JSON }}
      INPUT_PART: ${{ inputs.part }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validacao RGB/RGBA e SHA sem pagar proxy
        run: python -m pip install --quiet "Pillow==11.3.0"
      - name: Validar aprovacao exata, derivado intacto e references Bible
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ep01_approved_v3_parts -v
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from videoforge import ep01_approved_v3_parts as engine
          if os.environ["GITHUB_EVENT_NAME"]=="workflow_dispatch":
              part=os.environ.get("INPUT_PART","").strip()
          else:
              expected=Path("canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-PARTE-C01-P04-V3.json")
              changed=subprocess.check_output(
                  ["git","diff-tree","--no-commit-id","--name-only","-r",os.environ["GITHUB_SHA"]],text=True).splitlines()
              if str(expected) not in changed:
                  raise SystemExit("EP01_APPROVED_V3_PART_REQUEST_NOT_CHANGED")
              req=json.loads(expected.read_text(encoding="utf-8"))
              if (req.get("schema")!="videoforge/ep01-approved-v3-independent-part-request/v1"
                  or req.get("channel")!="alchemy-lab"
                  or req.get("video_id")!="mmorpg-conquiste-a-princesa-ep01"
                  or req.get("shot_id")!="C01-P04"
                  or req.get("approved_original_sha256")!=engine.SOURCE_SHA
                  or req.get("one_paid_call_per_part_run") is not True
                  or req.get("retry_on_failure") is not False
                  or req.get("no_pixel_segmentation") is not True
                  or req.get("human_visual_approval") is not False
                  or req.get("rig_ready") is not False
                  or req.get("youtube_upload") is not False):
                  raise SystemExit("EP01_APPROVED_V3_PART_REQUEST_INVALID")
              part=req.get("part","")
          if part not in engine.ROLE_CONFIG:
              raise SystemExit("EP01_APPROVED_V3_PART_NOT_IN_C01_P04")
          old=engine.existing_part(part)
          if old:
              print("EP01_APPROVED_V3_PART_ALREADY_ARCHIVED_NO_NEW_BILL",part,old["sha256"])
              execute="false"
          else:
              spec=engine.prepare(part)
              print("EP01_APPROVED_V3_PART_PREFLIGHT_SHA_OK",part,len(spec["images"]),"images",spec["source"]["sha256"])
              execute="true"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("part="+part+"\n")
              out.write("execute="+execute+"\n")
          PY
      - name: Verificar conexao com proxy sem expor credenciais
        if: steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CODEX_PROXY_API_KEY" ]]; then
            echo "::error::CODEX_PROXY_API_KEY ausente"; exit 1
          fi
          if [[ -n "$CODEX_PROXY_BASE_URL" ]]; then
            printf 'PROXY_ENDPOINT=%s\n' "$CODEX_PROXY_BASE_URL" >> "$GITHUB_ENV"
          elif [[ -n "$CODEX_PROXY_ACCOUNTS_JSON" ]]; then
            echo 'PROXY_ENDPOINT=http://127.0.0.1:18080' >> "$GITHUB_ENV"
            echo 'USE_EPHEMERAL=1' >> "$GITHUB_ENV"
          else
            echo "::error::Falta CODEX_PROXY_BASE_URL ou CODEX_PROXY_ACCOUNTS_JSON"; exit 1
          fi
      - name: Ligar proxy efemero precompilado quando necessario
        if: steps.preflight.outputs.execute == 'true' && env.USE_EPHEMERAL == '1'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vf-proxy-state"
          python - <<'PY'
          import json,os
          from pathlib import Path
          value=json.loads(os.environ["CODEX_PROXY_ACCOUNTS_JSON"])
          assert isinstance(value,dict) and isinstance(value.get("records"),list)
          assert value["records"] and all(isinstance(r,dict) and isinstance(r.get("token"),dict) for r in value["records"])
          p=Path(os.environ["RUNNER_TEMP"])/"vf-proxy-state"/"accounts.json"
          p.write_text(json.dumps(value),encoding="utf-8")
          p.chmod(0o600)
          PY
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1
          docker run -d --name vf-proxy-c01p04-v3-parts \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8080 \
            -e PROXY_API_KEY="$CODEX_PROXY_API_KEY" -e DATA_DIR=/app/data \
            -e DEBUG_LOG_PAYLOADS=false \
            -v "$RUNNER_TEMP/vf-proxy-state:/app/data:rw" \
            ghcr.io/helioconde/videoforge-codex-proxy:upstream-02f8ce3581c1 >/dev/null
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Proxy nao respondeu /health/live"; exit 1
      - name: Gerar um novo PNG de componente pelo proxy
        if: steps.preflight.outputs.execute == 'true'
        shell: bash
        env:
          PART: ${{ steps.preflight.outputs.part }}
        run: |
          set -euo pipefail
          python -m videoforge.proxy_images health --url "$PROXY_ENDPOINT"
          python -m videoforge.ep01_approved_v3_parts --part "$PART" --url "$PROXY_ENDPOINT"
      - name: Preservar mesmo se QA tecnico reprovar
        if: always() && steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-c01p04-approved-v3-independent-parts "${{ job.status }}"
      - name: Anexar originais e comprovantes para conferencia
        if: always() && steps.preflight.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ep01-c01p04-v3-part-${{ steps.preflight.outputs.part }}-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens/
          if-no-files-found: warn
          retention-days: 30
      - name: Apagar tokens temporarios do runner
        if: always()
        shell: bash
        run: |
          docker rm -f vf-proxy-c01p04-v3-parts >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vf-proxy-state"
