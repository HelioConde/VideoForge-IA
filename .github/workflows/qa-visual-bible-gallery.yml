name: "VideoForge - Biblia Visual galeria de revisao"
run-name: "Bíblia Visual / galeria de PNGs reais"
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VideoForge - Biblia Visual gerar mestres em lotes"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: alchemy-ep01-gallery-main
  cancel-in-progress: false
jobs:
  make-gallery:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar miniaturas locais sem chamada de IA
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Gerar pranchas e links com SHA verificado
        run: python scripts/gerar-galeria-biblia.py
      - name: Arquivar galeria e lista de revisão sem aprovar artes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'videoforge-biblia[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- canal/alchemy-lab/biblia-visual/galeria/
          git add -- canal/alchemy-lab/biblia-visual/GALERIA-EP01.md
          if git diff --cached --quiet; then
            echo "BIBLE_GALLERY_ALREADY_UP_TO_DATE"
            exit 0
          fi
          git commit -m 'qa(biblia): atualizar galeria real SHA sem promover imagens'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "BIBLE_GALLERY_PUBLISHED_FOR_HUMAN_REVIEW"
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Gallery update conflicted; no PNG original changed"
                exit 1
              fi
            fi
          done
          exit 1
