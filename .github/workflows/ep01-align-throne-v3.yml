name: "VideoForge - EP01 alinhar C01-P04 V3 aprovada sem IA"
run-name: "EP01 C01-P04 V3 alinhar 1 px sem mudar arte"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-ALINHAMENTO-C01-P04-V3.json'

permissions:
  contents: write

concurrency:
  group: ep01-c01p04-v3-technical-alignment-main
  cancel-in-progress: false

jobs:
  alinhar-png:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Biblioteca de pixels apenas, sem chamadas ao proxy
        run: python -m pip install --quiet "Pillow==11.3.0"
      - name: Verificar aprovacao visual do PNG original, SHA e idempotencia
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ep01_align_throne_v3 -v
          python - <<'PY'
          import json,os
          from pathlib import Path
          from videoforge import ep01_align_throne_v3 as engine
          path=Path("canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-ALINHAMENTO-C01-P04-V3.json")
          req=json.loads(path.read_text(encoding="utf-8"))
          if (req.get("schema")!="videoforge/ep01-v3-one-row-alignment-request/v1"
              or req.get("shot_id")!="C01-P04"
              or req.get("source_sha256")!=engine.SOURCE_SHA
              or req.get("source_run_id")!=engine.SOURCE_RUN
              or req.get("no_proxy_calls") is not True
              or req.get("allow_crop_or_resize") is not False
              or req.get("rig_ready") is not False
              or req.get("youtube_upload") is not False):
              raise SystemExit("EP01_V3_ALIGNMENT_REQUEST_INVALID")
          engine.approved_original()
          prev=engine.already_archived()
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("execute="+("false" if prev else "true")+"\n")
          print("EP01_V3_ALIGNMENT_PREFLIGHT_OK", "archive_already_exists" if prev else "execute", "image_calls=0")
          PY
      - name: Repetir apenas a ultima linha, sem cortar ou interpolar
        if: steps.preflight.outputs.execute == 'true'
        run: python -m videoforge.ep01_align_throne_v3
      - name: Arquivar PNG tecnico no canal sem substituir aprovado
        if: always() && steps.preflight.outputs.execute == 'true'
        shell: bash
        run: |
          bash scripts/arquivar-pngs-se-existirem.sh alchemy-lab mmorpg-conquiste-a-princesa-ep01 \
            output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens \
            "${{ github.run_id }}" production-scene-mother-orientation-v3-aligned "${{ job.status }}"
      - name: Guardar comprovantes e PNG derivado
        if: always() && steps.preflight.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ep01-c01p04-v3-aligned-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/imagens/
          retention-days: 30
          if-no-files-found: warn
