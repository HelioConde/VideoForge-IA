name: "EP01 - auditoria de camadas RGBA e preparo de rig"
on:
  pull_request:
    paths:
      - "scripts/ep01_rig_readiness_audit.py"
      - "tests/test_ep01_rig_readiness_audit.py"
      - ".github/workflows/ep01-rig-readiness-audit.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ep01-rig-readiness-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ep01-rig-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AI_ENABLED: "false"
      PAID_CALLS_ENABLED: "false"
      IMAGE_GENERATION_ENABLED: "false"
      YOUTUBE_PUBLICATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow para leitura local dos PNGs
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Testar classificacao sem proxy e sem modificar PNG
        run: python -m unittest tests.test_ep01_rig_readiness_audit -v
      - name: Auditar as 42 tomadas com SHA e alpha sem aprovar rig
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ep01_rig_readiness_audit --output "$RUNNER_TEMP/ep01-rig-readiness"
          test -s "$RUNNER_TEMP/ep01-rig-readiness/EP01-rig-readiness.json"
          test -s "$RUNNER_TEMP/ep01-rig-readiness/EP01-rig-readiness.md"
      - name: Publicar relatorio de revisao no sumario da Action
        if: success()
        shell: bash
        run: cat "$RUNNER_TEMP/ep01-rig-readiness/EP01-rig-readiness.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep01-rig-readiness-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/ep01-rig-readiness/
          retention-days: 30
          if-no-files-found: warn
