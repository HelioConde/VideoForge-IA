name: "VideoForge - EP01 C01-P04 V3 QA encaixe punho direito"
run-name: "EP01 C01-P04 / comparar 4 ajustes do punho direito"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PEDIDO-QA-ALINHAMENTO-PUNHO-DIREITO-C01-P04-V3.json'
permissions:
  contents: write
concurrency:
  group: ep01-c01p04-right-cuff-alignment-main
  cancel-in-progress: false
jobs:
  comparar:
    # DISABLED_CREATOR_NO_HAND_QA_2026_11_17
    if: ${{ false }} # historical grip QA not needed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'Pillow==11.3.0'
      - name: Conferir SHAs e comparar ajuste de braçadeira sem IA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa_ep01_c01p04_right_cuff_alignment.py
      - name: Arquivar somente QA; originais intocados
        shell: bash
        run: |
          set -euo pipefail
          ep=canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$ep/QA-C01-P04-V3-GUARDA-DIREITO-ALINHAMENTO-PUNHO-V2.jpg" "$ep/QA-C01-P04-V3-GUARDA-DIREITO-ALINHAMENTO-PUNHO-V2.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa(ep01): variantes W1-W4 do punho direito sem promover rig"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep01-c01p04-v3-right-cuff-alignment-qa
          path: canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/QA-C01-P04-V3-GUARDA-DIREITO-ALINHAMENTO-PUNHO-V2*
          if-no-files-found: warn
          retention-days: 30
