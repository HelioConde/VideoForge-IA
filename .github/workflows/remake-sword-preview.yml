name: "VideoForge - C01-P02 espada Three.js preflight e preview real"
on:
  push:
    branches: [main]
    paths:
      - 'videoforge/remake_sword_preview.py'
      - 'videoforge/remake_rig_geometry.py'
      - 'tests/test_remake_rig_geometry.py'
      - 'videoforge/remake_sword_preview_qa.py'
      - 'videoforge/remake_sword_checkpoint.py'
      - 'tests/test_remake_sword_preview.py'
      - 'motion-remotion/src/remake-sword-preview*.ts*'
      - 'motion-remotion/src/remake-sword-rig.tsx'
      - '.github/workflows/remake-sword-preview.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'GitHub Actions run que gerou o artifact de 5 PNGs C01-P02 e manifesto real'
        required: true
        type: number
  workflow_run:
    workflows: ["VideoForge - C01-P02 pacote da arte real por SHA"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: vf-remake-sword-preview
  cancel-in-progress: false

jobs:
  locate-source-artifact:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.verify.outputs.available }}
      source_run_id: ${{ steps.verify.outputs.source_run_id }}
    steps:
      - name: Verificar artifact verdadeiro no run de empacotamento, sem IA e sem inventar arquivo
        uses: actions/github-script@v7
        id: verify
        env:
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
        with:
          script: |
            const run=Number(process.env.SOURCE_RUN_ID);
            if(!Number.isSafeInteger(run)||run<=0){
              core.setFailed('REMAKE_SWORD_REAL_SOURCE_RUN_ID_REQUIRED');
              return;
            }
            const {data}=await github.rest.actions.listWorkflowRunArtifacts({
              owner:context.repo.owner,repo:context.repo.repo,run_id:run,per_page:100
            });
            const expected='vf-remake-c01-p02-sword-source-'+run;
            const matches=data.artifacts.filter(a=>a.name===expected&&!a.expired);
            core.setOutput('source_run_id',String(run));
            core.setOutput('available',matches.length===1?'true':'false');
            core.info(matches.length===1
              ? 'REMAKE_SWORD_VERIFIED_SOURCE_ARTIFACT_PRESENT'
              : 'REMAKE_SWORD_REAL_SOURCE_NOT_READY_NO_RENDER');
            if(matches.length>1)core.setFailed('REMAKE_SWORD_DUPLICATE_SOURCE_ARTIFACT');
  preflight-source-and-code:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar o bloqueio real e testar o pacote independente sem API paga
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_remake_sword_preview tests.test_remake_starter -v
          python -m videoforge.remake_sword_preview preflight
          echo "C01_P02_REAL_ART_REQUIRED; no image API and no fabricated media"

  smoke-recomposition-test-only:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    container:
      image: ghcr.io/helioconde/videoforge-remotion-runner:rig-three-remotion4-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar FFmpeg ja presente e recomposicao sintetica por Python stdlib
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          python -c "import struct,zlib; print('REMAKE_SWORD_STDLIB_READY')"
          python -m unittest tests.test_remake_sword_preview -v
          echo "TEST_ONLY_SYNTHETIC_FIXTURE_VALIDATED; NO REAL_ART_NO_MP4_NO_PROXY"
      - name: Testar dois frames reais ThreeCanvas com PNGs sinteticos apenas de CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tests.test_remake_sword_preview import SwordPreviewTests
          from videoforge.remake_sword_preview import prepare
          root=Path("output/remake-sword-smoke/test-repo")
          source=SwordPreviewTests().fixture(root)
          result=prepare(source,12345,
              Path("output/remake-sword-smoke/preview"),
              Path("motion-remotion/public/vf-remake/c01-p02"),root)
          assert result["neutral_mae_rgb"]==0
          assert result["human_visual_approved"] is False
          print("RIG_SYNTHETIC_REAL_RGBA_STAGED_NO_REAL_ART")
          PY
          ln -s /opt/videoforge-remotion/node_modules motion-remotion/node_modules
          cd motion-remotion
          ./node_modules/.bin/tsc --noEmit
          node --test tests/remake-sword-motion.test.cjs tests/remake-sword-preview.test.cjs
          ./node_modules/.bin/remotion still             src/remake-sword-preview-index.ts VideoForgeC01P02SwordTechnical             ../output/remake-sword-smoke/frame-07.png             --props=../output/remake-sword-smoke/preview/props.json             --frame=7 --gl=swangle --log=error
          ./node_modules/.bin/remotion still             src/remake-sword-preview-index.ts VideoForgeC01P02SwordTechnical             ../output/remake-sword-smoke/frame-71.png             --props=../output/remake-sword-smoke/preview/props.json             --frame=71 --gl=swangle --log=error
          cd ..
          test -s output/remake-sword-smoke/frame-07.png
          test -s output/remake-sword-smoke/frame-71.png
          if cmp -s output/remake-sword-smoke/frame-07.png output/remake-sword-smoke/frame-71.png; then
            echo "::error::A espada nao se moveu na previa sintética ThreeCanvas"
            exit 1
          fi
          echo "THREECANVAS_C01_P02_ACTUAL_WEBGL_FRAME_CHANGE_SYNTHETIC_QA_PASS"

  render-three-draft:
    needs: locate-source-artifact
    if: github.ref == 'refs/heads/main' && needs.locate-source-artifact.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/helioconde/videoforge-remotion-runner:rig-three-remotion4-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      ART_RUN: ${{ needs.locate-source-artifact.outputs.source_run_id }}
      OUTPUT: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/remake-v2/C01-P02
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recuperar imagem-mãe e 4 sprites da mesma tomada aprovada tecnicamente
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.locate-source-artifact.outputs.source_run_id }}
          name: vf-remake-c01-p02-sword-source-${{ needs.locate-source-artifact.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./input/source
      - name: Validar manifestos, origem SHA, alfa, pivô, recomposição neutra e limites
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_remake_sword_preview -v
          python -m videoforge.remake_rig_geometry \
            --package ./input/source --source-run-id "$ART_RUN" --verify-report
          python -m videoforge.remake_sword_preview prepare \
            --package ./input/source --source-run-id "$ART_RUN" \
            --output "$OUTPUT" --public motion-remotion/public/vf-remake/c01-p02
      - name: Reutilizar motor preinstalado Remotion + ThreeCanvas
        shell: bash
        run: |
          set -euo pipefail
          ln -s /opt/videoforge-remotion/node_modules motion-remotion/node_modules
          cd motion-remotion
          ./node_modules/.bin/tsc --noEmit
          node --test tests/remake-sword-motion.test.cjs tests/remake-sword-preview.test.cjs
      - name: Renderizar 90 frames de mao e lamina independentes com watermark
        shell: bash
        run: |
          set -euo pipefail
          cd motion-remotion
          ./node_modules/.bin/remotion render \
            src/remake-sword-preview-index.ts VideoForgeC01P02SwordTechnical \
            "../$OUTPUT/c01-p02-three-sword-technical.mp4" \
            --props="../$OUTPUT/props.json" --frames=0-89 \
            --codec=h264 --pixel-format=yuv420p --gl=swangle --concurrency=1 --log=error
      - name: Conferir movimento real em frames decodificados e gerar QA com SHA
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.remake_sword_preview_qa --output "$OUTPUT"
      - name: Guardar MP4 tecnico e hashes sem YouTube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vf-remake-c01-p02-three-preview-${{ github.run_id }}
          path: output/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/remake-v2/C01-P02/
          retention-days: 90
          if-no-files-found: warn

  checkpoint-in-git-host:
    needs: render-three-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: vf-remake-c01-p02-three-preview-${{ github.run_id }}
          path: ./input/render
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirmar SHA real dos binarios e gravar checkpoint sem FFmpeg no host
        shell: bash
        run: |
          set -euo pipefail
          command -v git
          python -m videoforge.remake_sword_checkpoint --input ./input/render
          EP="canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01"
          git add "$EP/QA-C01-P02-REMAKE-V2.json" "$EP/remake-ep01-planos.json" \
            "$EP/ESTADO-ATUAL.md" "$EP/HISTORICO-DESENVOLVIMENTO.md" \
            "$EP/estado-atual.json"
          if ! git diff --cached --quiet; then
            git config user.name "videoforge-autopilot[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(dorama): QA tecnico real C01-P02 espada e checkpoint"
            git push origin HEAD:main
          else
            echo "C01_P02_ALREADY_RECORDED"
          fi
