name: "VideoForge - Remake do Dorama - Autonomia e Checkpoint"
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
  workflow_run:
    workflows:
      - "VideoForge - arte de referencia por pedido do canal"
      - "VideoForge - Gerar cena-mae real por canal e referencia"
      - "VideoForge - referencias cinematograficas de Kael e Elara (somente originais)"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'videoforge/remake_autopilot.py'
      - 'videoforge/remake_starter.py'
      - 'videoforge/remake_rig_geometry.py'
      - 'tests/test_remake_rig_geometry.py'
      - 'videoforge/remake_v2_edl.py'
      - 'videoforge/remake_episode_audio.py'
      - 'tests/test_remake_episode_audio.py'
      - 'videoforge/remake_motion_directions.py'
      - 'tests/test_remake_motion_directions.py'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/remake-v2-motion-directions.json'
      - 'tests/test_remake_v2_edl.py'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/remake-v2-cinematic-edl.json'
      - 'tests/test_remake_starter.py'
      - '.agents/skills/**'
      - 'docs/BIBLIOTECAS-E-SKILLS-VIDEOFORGE.md'
      - 'videoforge/image_generation_policy.py'
      - 'videoforge/cinematic_direction.py'
      - 'videoforge/production_scenes.py'
      - 'videoforge/remake_reference.py'
      - 'tests/test_remake_reference.py'
      - '.github/workflows/production-scene-by-request.yml'
      - '.github/workflows/qa-permanent-image-archive.yml'
      - '.github/workflows/qa-cinematic-shots.yml'
      - '.github/workflows/qa-cinematic-edl.yml'
      - 'tests/test_remake_workflow_compatibility.py'
      - 'tests/test_remake_cinematic_integration.py'
      - 'tests/test_remake_autopilot.py'
      - 'videoforge/reference_art_qa.py'
      - 'tests/test_reference_art_qa.py'
      - 'videoforge/cinematic_chat_references.py'
      - 'tests/test_cinematic_chat_references.py'
      - '.github/workflows/qa-alchemy-chat-cinematic-references.yml'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/referencias/chat-aprovadas/**'
      - 'videoforge/production_art.py'
      - 'tests/test_production_art.py'
      - 'videoforge/grounded_identity.py'
      - 'videoforge/grounded_review.py'
      - 'tests/test_grounded_review.py'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/geracoes/production-art-request/**'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/remake-ep01-planos.json'
      - 'canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/autonomy-policy.json'
      - '.github/workflows/remake-autonomy.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: alchemy-remake-ep01-checkpoint
  cancel-in-progress: false

jobs:
  diagnosticar-e-retomar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar regras e estado do remake sem gastar IA
        run: |
          set -euo pipefail
          python -m unittest tests.test_cinematic_chat_references tests.test_reference_art_qa tests.test_production_art tests.test_grounded_review tests.test_remake_recovery tests.test_remake_autopilot tests.test_remake_starter tests.test_remake_policy_consistency tests.test_remake_cinematic_integration tests.test_remake_v2_edl tests.test_remake_motion_directions tests.test_remake_episode_audio tests.test_remake_rig_geometry tests.test_remake_reference tests.test_remake_workflow_compatibility tests.test_alchemy_no_image_generation tests.test_cinematic_direction -v
      - name: Verificar lista oficial V2 de 40 tomadas e audio de abertura
        run: |
          set -euo pipefail
          python -m videoforge.remake_v2_edl --check
          python -m videoforge.remake_episode_audio --verify-only
      - name: Auditar referencia real de personagens sem criar novas imagens
        run: |
          set -euo pipefail
          mkdir -p output
          python -m videoforge.reference_art_qa --sync --output output/remake-identity-reference-qa.json
      - name: Inspecionar SHA, detectar proxima etapa e atualizar checkpoint
        run: |
          set -euo pipefail
          mkdir -p output
          python -m videoforge.remake_autopilot --report output/remake-autonomy-report.json --sync
      - name: Verificar direcao de 160 acoes temporizadas sem fonte de arte inventada
        run: |
          set -euo pipefail
          python -m videoforge.remake_motion_directions
      - name: Compilar fila idempotente de 40 tomadas com bibliotecas e skills existentes
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.remake_starter --output output/remake-shot-queue.json
      - name: Reservar UMA chamada autorizada de referencia no checkpoint antes de despachar
        id: reserve
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.remake_autopilot --reserve --report output/remake-generation-reservation.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("output/remake-generation-reservation.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("ready="+("true" if d["ready"] else "false")+"\n")
          print("ONE_SHOT_GENERATION_RESERVATION",d["ready"],d.get("reason","reserved"))
          PY
      - name: Persistir arquivos principais somente quando o estado mudou
        shell: bash
        run: |
          set -euo pipefail
          EP="canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01"
          git add "$EP/ESTADO-ATUAL.md" "$EP/HISTORICO-DESENVOLVIMENTO.md" "$EP/estado-atual.json" "$EP/remake-ep01-planos.json"
          if [[ -f "$EP/QA-CHARACTER-BIBLE-V2.json" ]]; then git add "$EP/QA-CHARACTER-BIBLE-V2.json"; fi
          if ! git diff --cached --quiet; then
            git config user.name "videoforge-autopilot[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(dorama): atualizar checkpoint autonomo verificado"
            git push origin HEAD:main
          else
            echo "CHECKPOINT_ALREADY_CURRENT"
          fi
      - name: Despachar somente UMA referencia V2 por workflow_dispatch com reserva persistida
        if: steps.reserve.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("output/remake-generation-reservation.json").read_text(encoding="utf8"))
          assert data["ready"] is True
          assert data["workflow"]=="production-art-by-request.yml"
          assert data["asset"]=="character-bible"
          assert data["max_calls_per_run"]==1
          assert data["youtube_upload"] is False
          print("GENERATION_RESERVATION_VERIFIED",data["request_id"][:16])
          PY
          gh workflow run production-art-by-request.yml -R "$GH_REPO" --ref main \
            -f channel=alchemy-lab \
            -f video_id=mmorpg-conquiste-a-princesa-ep01 \
            -f asset=character-bible
          echo "ONE_AUTHORIZED_REFERENCE_WORKFLOW_DISPATCH_SUBMITTED"
      - name: Salvar prova de diagnostico para os agentes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videoforge-remake-autonomy-diagnostic
          path: |
            output/remake-autonomy-report.json
            output/remake-shot-queue.json
            output/remake-generation-reservation.json
            output/remake-identity-reference-qa.json
          retention-days: 14
          if-no-files-found: warn
