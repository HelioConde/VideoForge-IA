name: "VideoForge - recuperar PNG antigo de Actions para GitHub permanente"
on:
  pull_request:
    paths:
      - '.github/workflows/recuperar-imagens-antigas-actions.yml'
      - 'docs/requests/recuperar-imagens-do-actions.json'
      - 'videoforge/action_recovery_request.py'
      - 'tests/test_action_recovery_request.py'
  push:
    branches: [main]
    paths:
      - 'docs/requests/recuperar-imagens-do-actions.json'
      - '.github/workflows/recuperar-imagens-antigas-actions.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vf-import-historical-action-images
  cancel-in-progress: false

jobs:
  validate-recovery-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pinned request and old-artifact compatibility without downloading
        run: python -m unittest discover -s tests -p 'test_action_recovery_request.py' -v

  recover-existing-pngs-only:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar origem e proibir geracao de imagens
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python -m videoforge.action_recovery_request \
            --request docs/requests/recuperar-imagens-do-actions.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Baixar PNG e proveniencia de execucao existente
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.request.outputs.run }}
          name: ${{ steps.request.outputs.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output/${{ steps.request.outputs.ch }}/videos/${{ steps.request.outputs.vid }}/imagens/
      - name: Verificar nome e SHA do PNG recuperado sem inferencia
        env:
          CH: ${{ steps.request.outputs.ch }}
          VID: ${{ steps.request.outputs.vid }}
        run: |
          python -m videoforge.action_recovery_request \
            --request docs/requests/recuperar-imagens-do-actions.json \
            --verify-input "output/$CH/videos/$VID/imagens"
      - name: Verificar PNG e copiar apenas os bytes existentes
        shell: bash
        env:
          CH: ${{ steps.request.outputs.ch }}
          VID: ${{ steps.request.outputs.vid }}
          SOURCE_RUN: ${{ steps.request.outputs.run }}
          ARCHIVE_PRODUCER: ${{ steps.request.outputs.producer }}
        run: |
          set -euo pipefail
          INPUT="output/$CH/videos/$VID/imagens"
          find "$INPUT" -maxdepth 3 -type f -printf '%P %s bytes\n'
          test -n "$(find "$INPUT" -type f -name '*.png' -print -quit)"
          python -m videoforge.persist_generated_assets \
            --channel "$CH" --video-id "$VID" \
            --input "$INPUT" --run-id "$SOURCE_RUN" --producer "$ARCHIVE_PRODUCER"
      - name: Sincronizar Bib Visual e inventario usando apenas PNG restaurado
        shell: bash
        env:
          CH: ${{ steps.request.outputs.ch }}
          VID: ${{ steps.request.outputs.vid }}
        run: |
          set -euo pipefail
          python -m videoforge.visual_bible --channel "$CH"
          if [[ "$CH" == 'alchemy-lab' && "$VID" == 'mmorpg-conquiste-a-princesa-ep01' ]]; then
            python -m videoforge.ep01_image_inventory --write
          fi
      - name: Enviar PNG original para historico permanente do canal
        shell: bash
        env:
          CH: ${{ steps.request.outputs.ch }}
          VID: ${{ steps.request.outputs.vid }}
          SOURCE_RUN: ${{ steps.request.outputs.run }}
          ARCHIVE_PRODUCER: ${{ steps.request.outputs.producer }}
        run: |
          set -euo pipefail
          FILE="canal/$CH/videos/$VID/assets/geracoes/$ARCHIVE_PRODUCER/$SOURCE_RUN"
          git config user.name 'videoforge-assets[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$FILE"
          git add -A -- "canal/$CH/biblia-visual"
          if [[ "$CH" == 'alchemy-lab' && "$VID" == 'mmorpg-conquiste-a-princesa-ep01' ]]; then
            git add -f -- "canal/$CH/videos/$VID/CHECKPOINT-IMAGENS-EP01-AUTO.json"
          fi
          if git diff --cached --quiet; then
            echo 'ALREADY_ARCHIVED_SHA_IDENTICAL'
            exit 0
          fi
          git commit -m "assets($CH): recuperar PNG original e SHA do Actions run-$SOURCE_RUN"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          echo "RECOVERED_EXISTING_PNG_ARCHIVED $FILE"
