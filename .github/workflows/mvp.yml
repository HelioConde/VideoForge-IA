name: MVP - renderizar MP4 tecnico sem IA

on:
  # The MVP FFmpeg smoke is unrelated to Alchemy Lab's 37-shot cinema QA.
  # Avoid rerendering an unrelated MP4 for every JSON, doc, or shader change.
  push:
    branches: [main]
    paths:
      - 'videoforge/mvp.py'
      - 'videoforge/paths.py'
      - 'videoforge/errors.py'
      - 'tests/test_mvp.py'
      - 'tests/test_paths.py'
      - '.github/workflows/mvp.yml'
  pull_request:
    paths:
      - 'videoforge/mvp.py'
      - 'videoforge/paths.py'
      - 'videoforge/errors.py'
      - 'tests/test_mvp.py'
      - 'tests/test_paths.py'
      - '.github/workflows/mvp.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/helioconde/videoforge-media-runner:ubuntu2404-ffmpeg-v2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar ambiente precompilado sem instalar pacotes
        run: |
          python --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Rodar testes incluindo renderizacao real
        run: python -m unittest tests.test_mvp tests.test_paths tests.test_render_multichannel -v
      - name: Gerar MP4 tecnico verificavel
        run: python -m videoforge.mvp smoke --output dist/smoke.mp4
      - name: Arquivar MP4 e QA sem YouTube
        uses: actions/upload-artifact@v4
        with:
          name: videoforge-mvp-smoke
          path: |
            dist/smoke.mp4
            dist/smoke.qa.json
          retention-days: 7
          if-no-files-found: error
