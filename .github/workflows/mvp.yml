name: MVP - renderizar MP4 tecnico sem IA

on:
  push:
    branches: [main]
    paths:
      - 'videoforge/**'
      - 'tests/**'
      - 'canal/**'
      # O canal Alchemy arquiva muitos PNGs e relatorios por workflow.
      # Esses artefatos nao alteram o motor de renderizacao MVP.
      # Evita render MP4 smoke a cada PNG/JSON de QA importado.
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/**'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-*.json'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/qa-*.json'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/rig-*.json'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PLANO-ARTE-RIG-EP01.md'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/SEM-GERACAO-NOVAS-IMAGENS.lock'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/IMAGENS-EXTERNAS-PENDENTES.json'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/roteiro.md'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/storyboard.json'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/direcao-rig-remotion.json'
      - 'modelos/**'
      - 'docs/ARQUITETURA.md'
      - 'AGENTS.md'
      - '.github/workflows/mvp.yml'
  pull_request:
    paths:
      - 'videoforge/**'
      - 'tests/**'
      - 'canal/**'
      # O canal Alchemy arquiva muitos PNGs e relatorios por workflow.
      # Esses artefatos nao alteram o motor de renderizacao MVP.
      # Evita render MP4 smoke a cada PNG/JSON de QA importado.
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/assets/**'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/pedido-*.json'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/qa-*.json'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/rig-*.json'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/PLANO-ARTE-RIG-EP01.md'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/SEM-GERACAO-NOVAS-IMAGENS.lock'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/IMAGENS-EXTERNAS-PENDENTES.json'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/roteiro.md'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/storyboard.json'
      - '!canal/alchemy-lab/videos/mmorpg-conquiste-a-princesa-ep01/direcao-rig-remotion.json'
      - 'modelos/**'
      - 'docs/ARQUITETURA.md'
      - 'AGENTS.md'
      - '.github/workflows/mvp.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/helioconde/videoforge-media-runner:ubuntu2404-ffmpeg-v2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar ambiente precompilado sem instalar pacotes
        run: |
          python --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Rodar testes incluindo renderizacao real
        run: python -m unittest discover -s tests -v
      - name: Gerar MP4 tecnico verificavel
        run: python -m videoforge.mvp smoke --output dist/smoke.mp4
      - name: Arquivar MP4 e QA sem YouTube
        uses: actions/upload-artifact@v4
        with:
          name: videoforge-mvp-smoke
          path: |
            dist/smoke.mp4
            dist/smoke.qa.json
          retention-days: 7
          if-no-files-found: error
