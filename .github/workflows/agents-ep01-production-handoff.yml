name: "Agents - EP01 real Astra handoff to verified source production (no AI)"

# Creates actual source-pinned technical work orders and an archived image
# contact sheet. Never invokes the proxy, synthesizes images, edits originals,
# claims rig/art approval or publishes a video.
on:
  pull_request:
    paths:
      - '.github/workflows/agents-ep01-production-handoff.yml'
      - 'orchestrator/ep01_production_handoff.py'
      - 'orchestrator/agent_live_roundtrip.py'
      - 'orchestrator/shot_contact_sheet.py'
      - 'videoforge/ep01_continuity_motion.py'
      - 'tests/test_ep01_production_handoff.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agents-ep01-production-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-ep01-production-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-verified-handoff:
    if: >-
      github.repository == 'HelioConde/VideoForge-IA'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AI_ENABLED: 'false'
      PAID_CALLS_ENABLED: 'false'
      CODEX_PROXY_TEXT_AUTHORIZED: 'false'
      IMAGE_GENERATION_ENABLED: 'false'
      YOUTUBE_PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Pillow for offline copies of already archived art
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Test source-pinned agent work orders and fail-closed QA contracts
        run: |
          python -m unittest discover -s tests -p 'test_ep01_production_handoff.py' -v
          python -m unittest discover -s tests -p 'test_agent_live_evidence_gate.py' -v
          python -m unittest discover -s tests -p 'test_ep01_continuity_motion.py' -v
      - name: Read actual Astra journal and hash-verify all nine original mothers
        shell: bash
        run: |
          set -euo pipefail
          python -m orchestrator.ep01_production_handoff \
            --output-dir "$RUNNER_TEMP/ep01-production-handoff"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'ep01-production-handoff'
          work=json.loads((out/'handoff.json').read_text())
          brief=json.loads((out/'agent-06-layer-brief.json').read_text())
          inventory=json.loads((out/'nine-mother-source-inventory.json').read_text())
          motion=json.loads((out/'physical-cart-readiness.json').read_text())
          assert work['real_llm_calls_verified']==13
          assert len(work['real_roles_verified'])==12
          assert len(work['work_orders'])==12
          assert work['source_mother_hashes_verified']==9
          assert work['independent_source_text_QA'] is True
          assert work['production_gate']['human_visual_approval'] is False
          assert work['production_gate']['final_mp4_approved'] is False
          assert work['new_model_calls']==0 and work['new_image_generations']==0
          assert len(brief['required_layers'])==7 and brief['rig_created'] is False
          assert inventory['unique_source_images']==9
          assert motion['animated_motion_verified'] is False
          assert len(list((out/'contact-sheet').glob('*-preview.jpg')))==9
          assert (out/'contact-sheet'/'c07-c08-9-shots-contact.jpg').is_file()
          print('Verified 13 real role call journals, 9 archived PNG SHA checks, 12 work orders and 7-layer brief. Production gates remain blocked.')
          PY
      - name: Archive verified work orders, contact sheet and QA blockers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-real-agents-source-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/ep01-production-handoff/
          retention-days: 14
          if-no-files-found: error
